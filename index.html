<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Morpheme Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, one scrolling panel per tab, fixed bottom tab bar.
   Morpheme colours carry meaning everywhere: prefix = teal, base = blue, suffix = amber. */
:root{
  --bg:#EBF0F3; --surface:#F9FBFC; --ink:#1C2631; --muted:#556372; --line:#C8D3DC;
  --pre:#1E7566; --pre-bg:#D8EEE8;
  --base:#2B4C9E; --base-bg:#DDE5F8;
  --suf:#9E540F; --suf-bg:#F6E4CF;
  --good:#24724A; --good-bg:#D9EEE0; --bad:#AE372D; --bad-bg:#F6DCD8;
  --vow:#8A2B7C; --vow-bg:#F4DEF0; --con:#5E5C10; --con-bg:#EEEDCB;
  --display:"Bricolage Grotesque","Lexend",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11171E; --surface:#19212B; --ink:#E4EAF0; --muted:#98A6B4; --line:#2D3946;
  --pre:#6CC6B1; --pre-bg:#1C3732; --base:#93ABF2; --base-bg:#222E4B; --suf:#E8A867; --suf-bg:#3B2A1A;
  --good:#7FD3A2; --good-bg:#1B3427; --bad:#F19389; --bad-bg:#3D211F;
  --vow:#E79BD9; --vow-bg:#3A1F36; --con:#D8D46E; --con-bg:#33321A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#19212B; --ink:#E4EAF0; --muted:#98A6B4; --line:#2D3946;
  --pre:#6CC6B1; --pre-bg:#1C3732; --base:#93ABF2; --base-bg:#222E4B; --suf:#E8A867; --suf-bg:#3B2A1A;
  --good:#7FD3A2; --good-bg:#1B3427; --bad:#F19389; --bad-bg:#3D211F;
  --vow:#E79BD9; --vow-bg:#3A1F36; --con:#D8D46E; --con-bg:#33321A; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
html.large body{font-size:19.5px}
body.spaced{letter-spacing:.05em;word-spacing:.16em}
*{box-sizing:border-box}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--base);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
i{font-style:normal;font-weight:600}
.gr{font-family:var(--mono);font-weight:700;color:var(--base);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{display:flex;gap:2px;font-family:var(--mono);font-weight:700;font-size:.8rem}
.logo span{padding:1px 5px;border-radius:5px}
.logo .a{background:var(--pre-bg);color:var(--pre)} .logo .b{background:var(--base-bg);color:var(--base)} .logo .c{background:var(--suf-bg);color:var(--suf)}
.brand h1{font-size:1.15rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;font-weight:600;cursor:pointer}

/* page */
main{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
section{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted)}
.lede{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--base);border-color:var(--base);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.tip{border-left:4px solid var(--suf);padding:4px 0 4px 12px;color:var(--muted)}

/* tiles & word sums */
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;font-family:var(--mono);font-size:1.15rem}
.unit{display:inline-flex;align-items:center;white-space:nowrap}
.tile{display:inline-block;padding:.22em .55em;border-radius:9px;border:1.5px solid;font-family:var(--mono);font-weight:700;line-height:1.3}
.tile.prefix{color:var(--pre);background:var(--pre-bg);border-color:var(--pre)}
.tile.base{color:var(--base);background:var(--base-bg);border-color:var(--base)}
.tile.suffix{color:var(--suf);background:var(--suf-bg);border-color:var(--suf)}
.tile.dbl{color:var(--con);background:transparent;border:1.5px dashed var(--con)}
.mark{color:var(--bad);font-weight:700;padding-left:2px}
.mark.y{color:var(--vow)}
.chg{display:inline-block;border-radius:4px;padding:0 .08em;color:var(--surface)}
.chg.k{background:var(--good)}
.chg.e{background:var(--bad)} .chg.y{background:var(--vow)} .chg.d{background:var(--con)}
.op{color:var(--muted);font-weight:700}
.arrow{padding-inline:4px}
.result{font-weight:700;font-size:1.3rem;padding:.1em .5em;border-radius:9px;background:var(--bg);border:1.5px solid var(--ink)}
.result.q{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted);margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:8px}
.notes li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-top:.6em}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.95rem}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.info{background:var(--bg);color:var(--muted)}
.def{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.def .pos{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted)}
.def p{max-width:60ch}
.mouth-box{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.mouth{width:100%;max-width:400px;height:auto;margin:0 auto;display:block}
.mouth-cap{font-size:.92rem;min-height:3em}
.m-skin{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.m-wall{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.m-floor{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4}
.m-tooth{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.m-tongue{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.8}
.m-label{font-family:var(--body);font-size:10.5px;fill:var(--muted);letter-spacing:0;word-spacing:0}
.m-tlabel{fill:var(--bad);font-weight:600}
#mJaw{transform-box:view-box;transform-origin:150px 95px;transform:rotate(3deg);transition:transform .45s ease}
#mLip{transition:transform .35s ease}
.tg{opacity:0;transition:opacity .35s}
#tg-low{opacity:1}
.m-t.closed #tg-low,.m-s #tg-low{opacity:0}
.m-t.closed #tg-t,.m-s #tg-s{opacity:1}
.m-aah #mJaw{transform:rotate(14deg)}
.m-b.closed #mJaw,.m-t #mJaw,.m-s #mJaw{transform:rotate(0deg)}
.m-b.closed #mLip{transform:translateY(-4px)}
.m-s #mLip,.m-t #mLip{transform:translateY(6px)}
#mTongue{transition:transform .45s ease}
.m-aah #mTongue{transform:translateY(16px)}
.m-b.release #mTongue{transform:translateY(6px)}
.m-t.release #mTongue{transform:translateY(5px)}
.m-b.release #mJaw{transform:rotate(7deg)}
.m-t.release #mJaw{transform:rotate(5deg)}
.air{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 9;opacity:0;transition:opacity .3s;animation:flow .8s linear infinite;stroke:var(--con)}
.m-arrowhead{fill:var(--con)}
.m-aah #air-free{stroke:var(--vow)}
.m-aah .m-arrowhead{fill:var(--vow)}
.m-aah #air-free,.m-b.release #air-free,.m-t.release #air-free,.m-b.closed #air-b,.m-t.closed #air-t,.m-s #air-s{opacity:1}
@keyframes flow{to{stroke-dashoffset:-32}}
.press{fill:var(--con);opacity:0;transform-box:fill-box;transform-origin:center}
.m-b.closed #press-b,.m-t.closed #press-t{opacity:.55;animation:press 1.2s ease-in infinite}
@keyframes press{0%{transform:scale(.4);opacity:.2}100%{transform:scale(1.3);opacity:.7}}
.fx{fill:none;stroke:var(--con);stroke-width:2;stroke-linecap:round;opacity:0;transition:opacity .25s}
.m-b.release #puff,.m-t.release #puff,.m-s #hiss{opacity:1}
.m-s #hiss{animation:hiss .3s steps(2) infinite}
@keyframes hiss{50%{transform:translateX(2px)}}
.letters{display:inline-flex;gap:4px;flex-wrap:wrap}
.lt{font-family:var(--mono);font-weight:700;font-size:1.25rem;min-width:1.7em;text-align:center;padding:.15em .2em;border-radius:7px;border:1.5px solid var(--line);background:var(--surface)}
.lt.v{background:var(--vow);color:var(--surface);border-color:var(--vow)}
.fl{display:inline-block;border-radius:5px;padding:0 .12em;margin-right:1px}
.fl.v{background:var(--vow);color:var(--surface)}
.fl.c{background:var(--con);color:var(--surface)}
.vc{display:grid;gap:14px}
.vc>div{display:flex;flex-direction:column;gap:6px}
.wordgrid{display:grid;gap:14px}
.wordgrid>div{display:flex;flex-direction:column;gap:6px}
.wordgrid .cap{font-size:.88rem;color:var(--muted)}
.vs-ans{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;padding:4px 10px 4px 4px;border-radius:10px}
.vs-ans.v{background:var(--vow-bg);color:var(--vow);border:1.5px solid var(--vow)}
.vs-ans.c{background:var(--con-bg);color:var(--con);border:1.5px solid var(--con)}
@media (min-width:560px){.wordgrid,.vc{grid-template-columns:1fr 1fr}}
.anim[data-play="1"] .stage{cursor:pointer}
.anim{display:flex;flex-direction:column;gap:8px}
.sec-title{font-size:1.35rem;font-weight:800}
.stage{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;font-family:var(--mono);font-weight:700;font-size:1.2rem;min-height:2.4rem}
.grp{display:inline-flex;padding:.18em .45em;border:1.5px solid;border-radius:9px;line-height:1.3;transition:border-radius .5s}
.grp.prefix{color:var(--pre);background:var(--pre-bg);border-color:var(--pre)}
.grp.base{color:var(--base);background:var(--base-bg);border-color:var(--base)}
.grp.suffix{color:var(--suf);background:var(--suf-bg);border-color:var(--suf)}
.grp.dblg{color:var(--con);border:1.5px dashed var(--con);transition:border-color .5s,padding .5s}
.grp.dblg.merged{border-color:transparent;padding-inline:0}
.br{display:inline-block;max-width:1em;overflow:hidden;transition:max-width .5s,opacity .4s}
.dblg.merged .br{max-width:0;opacity:0}
.al{display:inline-block;max-width:1em;overflow:hidden;border-radius:4px;transition:max-width .5s ease,opacity .5s ease,padding .5s}
.al.pulse{animation:pulse .8s ease}
@keyframes pulse{50%{transform:scale(1.4)}}
.al.gone{max-width:0;opacity:0;padding:0!important}
.al.swap{animation:flip .55s ease}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.mk{display:inline-block;max-width:2em;overflow:hidden;color:var(--bad);padding-left:2px;transition:max-width .5s,opacity .4s,padding .5s}
.mk.y{color:var(--vow)}
.mk.gone{max-width:0;opacity:0;padding:0}
.plus{display:inline-block;max-width:2em;margin:0 .4em;overflow:hidden;color:var(--muted);transition:max-width .5s ease,margin .5s ease,opacity .4s}
.plus.gone{max-width:0;margin:0;opacity:0}
.tail{display:inline-flex;align-items:center;gap:6px;margin-left:.4em;max-width:22em;overflow:hidden;white-space:nowrap;transition:max-width .6s,opacity .4s,margin .6s}
.stage.go .tail{max-width:0;opacity:0;margin:0}
.stage.done{animation:pop .4s ease}
.stage .grp{transition:border-radius .5s,background-color .6s,border-color .6s,color .6s,padding .6s}
.stage .al{transition:max-width .5s ease,opacity .5s ease,padding .5s,background-color .6s,color .6s}
.stage.plain .grp{background:transparent;border-color:transparent;color:var(--ink);padding-inline:0;border-radius:0}
.stage.plain .al.chg{background:transparent;color:var(--ink);padding:0}
.stage.plain{font-size:1.6rem;font-family:var(--body);font-weight:600}
.stage.plain .grp{border-width:0}
.anim-cap{font-size:.9rem;color:var(--muted);line-height:1.5}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl-end{display:inline-flex;gap:6px;margin-left:auto}
.speak:disabled{opacity:.45;cursor:default}
.verdict p{margin:0}
.vw{font-family:var(--mono);font-size:1.05rem}
.pos-inl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.8;margin-left:4px}
.newtag{font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--good);color:var(--surface);margin-left:4px}
.anim-cap .final{font-family:var(--mono);font-size:1.15rem;margin-right:6px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--base);cursor:pointer;vertical-align:middle;margin-left:4px;padding:0;flex:none}
.sw{white-space:nowrap}
.sayrow{display:flex;flex-wrap:wrap;gap:8px}
.saychip{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-weight:700;padding:2px 2px 2px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg)}
.optrow{display:flex;gap:8px;align-items:center}
.optrow .opt{flex:1}
.speak[aria-pressed="true"]{background:var(--base);border-color:var(--base);color:var(--surface)}
.listen{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hear{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;border:2px solid var(--base);background:var(--base-bg);color:var(--base);font-weight:600;font-size:1.05rem;cursor:pointer;min-height:52px}
.hear svg{width:22px;height:22px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bscore{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bscore b{font-family:var(--display);font-size:1.3rem;color:var(--base)}
.points{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--base-bg);color:var(--base)}
.points b{font-family:var(--display);font-size:1.4rem}
.points span{font-size:.85rem;opacity:.85}
.clearbar{display:flex;align-items:center;gap:10px;margin-top:4px}
.cb-track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cb-track span{display:block;height:100%;width:100%;background:var(--muted);transform-origin:left;animation:drain linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.challenge{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--base);font-size:.92rem}
.addedtag{margin:0 0 6px;font-size:.88rem;font-weight:600;color:var(--good)}
.speak{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}

/* legend */
.legend{display:grid;gap:12px}
.legend div{display:grid;grid-template-columns:5.5rem 1fr;gap:12px;align-items:start}
.legend .tile{justify-self:start}

/* lessons */
.lesson-head{display:flex;flex-direction:column;gap:6px}
.lesson-head h2{font-size:1.75rem;font-weight:800}
.lesson-body{display:flex;flex-direction:column;gap:14px;max-width:65ch}
.lesson-body ul,.lesson-body ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--base)}
.dot.done{background:var(--pre)}
.pair{display:grid;gap:10px}
.pair .cap{font-size:.85rem;color:var(--muted)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px}

/* builder */
.bank h3{font-family:var(--body);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted);margin-bottom:8px}
.bank-tiles{display:flex;flex-wrap:wrap;gap:8px}
button.tile{cursor:pointer;font-size:1rem;min-height:42px;min-width:44px}
button.tile:active{transform:translateY(1px)}
.empty{color:var(--muted);font-style:normal;font-size:.95rem}

/* matrix */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-weight:700;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--base);border-color:var(--base);color:var(--surface)}
.origin{font-size:.92rem;color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip[aria-pressed="true"] .meta{color:inherit;opacity:.85}
.misslist.deadlist{margin:8px 0 0;padding:8px 10px 8px 26px;display:block;width:auto;font-size:.88rem}
.chcheck .deadlist li{display:list-item;margin:2px 0}
.chcheck .deadlist li>span:first-child{text-align:left}
.deadlist .mono{white-space:nowrap;margin-right:6px}
.mono{font-family:var(--mono);font-weight:700}
.banks button.tile.hint{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);transform:scale(1.04)}
.banks button.tile.dim{opacity:.28;cursor:help}
.banks button.tile.swapok{outline:2px dashed var(--ink);outline-offset:2px}
.guide-note{margin:0;font-size:.92rem;padding:8px 12px;border-radius:10px;background:var(--surface);border:1.5px dashed var(--ink)}
.donetag{margin:0;font-weight:600;color:var(--good);display:flex;align-items:center;gap:8px}
.tick{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--good);color:var(--surface);font-size:.8em;font-weight:800;flex:none}
.doneshelf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.doneword{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:700;font-size:.88rem;padding:3px 10px 3px 4px;border-radius:999px;background:var(--good-bg);color:var(--good)}

.pieces.editable li{grid-template-columns:minmax(4.2rem,auto) 1fr auto}
.pieces .edhint{display:flex!important;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}
.pieces button.tile{cursor:pointer;min-height:34px}
.pieces button.tile.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swapnote{color:var(--good);font-weight:600}
.edx{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--bad);font-weight:800;cursor:pointer;align-self:center}
.wordpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:3;box-shadow:0 6px 14px rgb(0 0 0 / .08);gap:10px;padding:12px 14px}

<script>
/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem('mw.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},

/* ---------- morphemes ---------- */
const PREFIXES=['af','pre','suf','en','re','de','in','con','un','im','as','inter','trans','ob','ex','sup','dis','pro','intro','cor','ab','e','non'];
const BASES={fix:{},son:{bound:1},gentle:{},simple:{},lie:{},tie:{},die:{},notice:{},courage:{},change:{},picnic:{ck:1},panic:{ck:1},begin:{dbl:1,stress:'last'},visit:{stress:'first'},travel:{stress:'first',ll:1},cancel:{stress:'first',ll:1},sign:{},struct:{bound:1},move:{},act:{},busy:{},port:{},form:{},spect:{bound:1},rupt:{bound:1},hope:{},stop:{dbl:1},rely:{},carry:{},hop:{dbl:1},run:{dbl:1},make:{},care:{}};
const SUFFIXES=['ant','y','ous','s','es','ed','ing','er','est','ly','ness','ful','less','al','ion','ive','ment','able','ance','ure','ate','ation','age','or','ator','acle','ify','ature','ist'];

const XT={},XD={},XM={}; // types, doubling and meanings for pieces found by Claude in the Split tab
const typeOf=s=>XT[s]||(BASES[s]?'base':PREFIXES.includes(s)?'prefix':'suffix');
const mk=s=>({s,t:typeOf(s),dbl:!!(BASES[s]&&BASES[s].dbl)||!!XD[s]});
const parse=str=>str.split('+').map(mk);
const g=x=>`<span class="gr">&lt;${x}&gt;</span>`;

/* Join elements, applying the three suffixing changes. */
function joinSum(parts,alt){
  let res='';const toks=[];const notes=[];const ch=[];const hl={};
  const note=k=>{notes.includes(k)||notes.push(k);};
  parts.forEach((p,i)=>{
    let c=null;
    if(i>0&&p.t==='suffix'){
      const vowel=/^[aeiouy]/.test(p.s), prevTok=toks[toks.length-1], prev=parts[i-1], B=BASES[prev.s]||{};

        else if(m==='double'&&vowel&&/[bdfgklmnprstvz]e$/.test(res)){res=res.slice(0,-1);res+=res.slice(-1);}
        else if(m==='drop'&&/e$/.test(res))res=res.slice(0,-1);

      }else if(/ie$/.test(res)&&/^i/.test(p.s)){                  // lie + ing -> lying
        res=res.slice(0,-2)+'y';prevTok.mark='/y';prevTok.k='y';prevTok.n=2;note('ie');c='ie';hl[res.length-1]='y';
      }else if(/[cg]e$/.test(res)&&/^[ao]/.test(p.s)){            // notice + able -> noticeable
        prevTok.k='k';prevTok.n=1;hl[res.length-1]='k';note('k');c='k';
      }else if(/e$/.test(res)&&!/ee$/.test(res)&&vowel){
        res=res.slice(0,-1);prevTok.mark='/';prevTok.k='e';prevTok.n=1;note('e');c='e';
      }else if(/[^aeiou]y$/.test(res)&&!/^i/.test(p.s)){
        res=res.slice(0,-1)+'i';prevTok.mark='/i';prevTok.k='y';prevTok.n=1;note('y');c='y';hl[res.length-1]='y';
      }else if(B.ck&&/^[eiy]/.test(p.s)){                         // picnic + (k) + ing
        hl[res.length-1]='d';res+='k';hl[res.length-1]='d';prevTok.k='d';prevTok.n=1;toks.push({dbl:'k'});note('ck');c='ck';
      }else if((prev.dbl||B.ll)&&vowel){                          // hop + (p) + ing, travel + (l) + ing
        const d=res.slice(-1);hl[res.length-1]='d';res+=d;hl[res.length-1]='d';prevTok.k='d';prevTok.n=1;toks.push({dbl:d});

      }else if(B.stress==='first'&&vowel&&/[aeiou][^aeiouwxy]$/.test(res)){ // visit + ing: no doubling

}
const isDblCode=c=>c==='d'||c==='ck'||c==='ll';
const CHANGE=c=>!!c&&c!=='u';
function sumHTML(parts,o={}){
  const j=joinSum(parts);const bits=[];
  j.toks.forEach((tk,i)=>{
    if(i>0)bits.push('<span class="op">+</span>');
    const k=tk.k||null,n=tk.n||1;
    const txt=k?`${tk.s.slice(0,-n)}<span class="chg ${k}">${tk.s.slice(-n)}</span>`:tk.s;
    bits.push(tk.dbl?`<span class="unit"><span class="tile dbl" title="doubled consonant">(<span class="chg d">${tk.dbl}</span>)</span></span>`
      :`<span class="unit"><span class="tile ${tk.t}">${txt}</span>${tk.mark?`<span class="mark ${k}">${tk.mark}</span>`:''}</span>`);
  });
  bits.push('<span class="op arrow">→</span>');
  const resTxt=j.res.split('').map((c,i)=>j.hl[i]?`<span class="chg ${j.hl[i]}">${c}</span>`:c).join('');
  bits.push(o.hide?'<span class="result q">?</span>':`<span class="result">${resTxt}</span>`);

const NOTE={
  e:()=>`The final ${g('e')} is dropped (marked <b>/</b>) because the next suffix starts with a vowel letter.`,
  y:()=>`The ${g('y')} changes to ${g('i')} (marked <b>/i</b>) because the next suffix doesn't start with ${g('i')}.`,
  d:()=>`The final consonant is doubled (shown in brackets) before a vowel suffix.`,
  le:()=>`The final ${g('le')} is dropped (marked <b>/</b>) when ${g('ly')} is added, so the ${g('l')} of ${g('ly')} takes its place.`,
  ie:()=>`${g('ie')} changes to ${g('y')} (marked <b>/y</b>) before a suffix starting with ${g('i')}, so you never write ${g('ii')}.`,
  k:()=>`The final ${g('e')} stays (shown in green) before ${g('a')} or ${g('o')}, to keep the ${g('c')} or ${g('g')} soft.`,
  ck:()=>`A ${g('k')} is added after the final ${g('c')} (shown in brackets) before ${g('e')}, ${g('i')} or ${g('y')}, so the ${g('c')} keeps its hard sound.`,
  ll:()=>`In British spelling, a final ${g('l')} after one vowel letter doubles before a vowel suffix, wherever the stress falls.`,
  ds:()=>`The base is stressed on its last syllable, so its final consonant doubles before a vowel suffix.`,
  u:()=>`The base is stressed on its first syllable, so its final consonant does not double.`
};
const notesHTML=n=>n.length?`<ul class="notes">${n.map(k=>`<li><span>${NOTE[k]()}</span></li>`).join('')}</ul>`:'';
const canSpeak=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
const SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const spellBtn=key=>canSpeak?`<button class="speak" data-say="${key}">${SPK}Say</button><button class="speak" data-spell="${key}">${SPK}Spell</button>`:'';
// Respellings for words the device voice mispronounces. Add more here as they are found.
const SAY_AS={unmoved:'un-mooved',unmovable:'un-moovable',immovable:'im-moovable'};
const sayText=w=>SAY_AS[w.toLowerCase()]||w;
let voiceList=[];
function loadVoices(){try{voiceList=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>((b.lang==='en-GB')-(a.lang==='en-GB'))||a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));}catch(e){voiceList=[];}fillVoiceSel();}
function chosenVoice(){const n=store.get('voice','');return voiceList.find(v=>v.name===n)||null;}
function fillVoiceSel(){const sel=document.getElementById('voiceSel');if(!sel)return;const cur=store.get('voice','');
  sel.innerHTML=`<option value="">Automatic (British English)</option>`+voiceList.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${v.name===cur?'selected':''}>${v.name} (${v.lang})</option>`).join('');
  document.getElementById('voiceSet').hidden=!canSpeak;}
function speak(txt,rate){try{const u=new SpeechSynthesisUtterance(txt);const v=chosenVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-GB';
  u.rate=Math.max(.4,rate*store.get('rate',1));speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
if(canSpeak){try{loadVoices();speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',loadVoices):(speechSynthesis.onvoiceschanged=loadVoices);}catch(e){}}
const spk=w=>canSpeak?`<button class="spk" data-sayw="${w}" aria-label="Hear ${w}">${SPK}</button>`:'';
const sw=w=>`<span class="sw"><i>${w}</i>${spk(w)}</span>`;
function spellOut(key){const w=joinSum(parse(key)).res;speak(w.split('').join(', '),.75);}

/* ---------- join animation (the word sum itself animates) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ANIM=new WeakMap();
const OPTS=new WeakMap();
function animHTML(key,o={}){
  const parts=parse(key),j=joinSum(parts);let h='',pi=-1;
  j.toks.forEach(tk=>{
    if(tk.dbl){h+=`<span class="plus" data-pd="${pi+1}">+</span><span class="grp dblg" data-d="${pi+1}"><span class="br">(</span><span class="al chg d">${tk.dbl}</span><span class="br">)</span></span>`;return;}
    pi++;if(pi)h+=`<span class="plus" data-p="${pi}">+</span>`;
    const k=tk.k||null,n=tk.n||1;
    const ls=tk.s.split('').map((c,x)=>`<span class="al${k&&x>=tk.s.length-n?' chg '+k:''}">${c}</span>`).join('');
    h+=`<span class="grp ${tk.t}" data-g="${pi}" data-morph="${tk.s}">${ls}</span>${tk.mark?`<span class="mk ${k}" data-m="${pi}">${tk.mark}</span>`:''}`;
  });
  const resTxt=j.res.split('').map((c,i)=>j.hl[i]?`<span class="chg ${j.hl[i]}">${c}</span>`:c).join('');
  h+=`<span class="tail"><span class="op arrow">→</span><span class="result">${resTxt}</span></span>`;
  const play=o.play&&parts.length>1;
  const cap=j.notes.length?j.notes.map(n=>NOTE[n]()).join(' '):(play?'Tap the word sum to watch the parts join again.':'');
  return `<div class="anim" data-anim="${key}" data-play="${play?1:0}" data-spell="${o.spell?1:0}" data-ctl="${o.controls===false?0:1}">
   <div class="stage" aria-label="Word sum">${h}</div>
   ${cap?`<p class="anim-cap${j.notes.length?'':' hintcap'}" aria-live="polite">${cap}</p>`:'<p class="anim-cap" aria-live="polite" hidden></p>'}
   ${o.trail===false?'':trailHTML(key,o.trail==='force')}
   <div class="ctl">${o.spell?spellBtn(key):''}${o.extra||''}</div></div>`;
}
function animState(el){let s=ANIM.get(el);if(!s){const parts=parse(el.dataset.anim);s={parts,j:joinSum(parts),next:1,busy:false,run:0,started:false};ANIM.set(el,s);}return s;}
function resetAnim(el){
  const extra=el.querySelector('.ctl [data-extra]');const o={play:el.dataset.play==='1',spell:el.dataset.spell==='1',controls:el.dataset.ctl!=='0',extra:extra?extra.outerHTML:''};
  const tmp=document.createElement('div');tmp.innerHTML=animHTML(el.dataset.anim,o);const n=tmp.firstElementChild;el.replaceWith(n);return n;}
async function animStep(el){
  const s=animState(el),{parts,j}=s;if(s.busy)return;
  const cap=el.querySelector('.anim-cap'),stage=el.querySelector('.stage');cap.hidden=true;
  if(stage.classList.contains('done'))return;
  s.busy=true;
  if(!s.started){s.started=true;stage.classList.add('go');
    await sleep(700);s.busy=false;return;}
  if(s.next>=parts.length){stage.classList.add('done');
    await sleep(900);
    if(el.isConnected)stage.classList.add('plain');
    s.busy=false;return;}
  const i=s.next,p=parts[i],prev=parts[i-1],c=j.ch[i];
  const pg=el.querySelector(`[data-g="${i-1}"]`),plus=el.querySelector(`[data-p="${i}"]`),mkEl=el.querySelector(`[data-m="${i-1}"]`);
  const als=pg?[...pg.querySelectorAll('.al')]:[];const lastL=als[als.length-1]||null,prevL=als[als.length-2]||null;
  if(c==='le'){
    prevL.classList.add('pulse');lastL.classList.add('pulse');await sleep(900);if(mkEl)mkEl.classList.add('gone');prevL.classList.add('gone');lastL.classList.add('gone');await sleep(500);
  }else if(c==='ie'){
    prevL.classList.add('pulse');lastL.classList.add('pulse');await sleep(800);if(mkEl)mkEl.classList.add('gone');
    prevL.textContent='y';prevL.classList.remove('pulse');prevL.classList.add('swap');lastL.classList.add('gone');await sleep(600);
  }else if(c==='k'){
    lastL.classList.add('pulse');await sleep(1000);
  }else if(c==='e'){
    
    lastL.classList.add('pulse');await sleep(900);if(mkEl)mkEl.classList.add('gone');lastL.classList.add('gone');await sleep(500);
  }else if(c==='y'){
    
    lastL.classList.add('pulse');await sleep(800);if(mkEl)mkEl.classList.add('gone');lastL.textContent='i';lastL.classList.remove('pulse');lastL.classList.add('swap');await sleep(600);
  }else if(isDblCode(c)){
    
    const dg=el.querySelector(`[data-d="${i}"]`);lastL.classList.add('pulse');dg.querySelector('.al').classList.add('pulse');await sleep(900);

  const s=animState(el);const token=++s.run;
  await sleep(delay);
  while(el.isConnected&&s.run===token&&!el.querySelector('.stage.done')){await animStep(el);if(s.run!==token)break;await sleep(650);}

function setMouth(s){
  const svg=document.getElementById('mouthSvg');if(!svg)return;const tok=++mouthTok;
  document.querySelectorAll('[data-mouth]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mouth===s));
  document.getElementById('mouthCap').innerHTML=MOUTH_CAP[s];
  const set=ph=>svg.setAttribute('class',`mouth m-${s}${ph?' '+ph:''}`);
  if(s==='aah'||s==='s'){set('');return;}
  const cycle=()=>{if(tok!==mouthTok||!svg.isConnected)return;set('closed');
    setTimeout(()=>{if(tok!==mouthTok||!svg.isConnected)return;set('release');setTimeout(cycle,1100);},1400);};
  cycle();
}

const LESSONS=[
 {k:'Before we start',t:'Vowels and consonants',h:()=>`
  <p>Every word you say is made of two kinds of sound. Say “aaah” and notice your mouth: it stays open and the air flows out freely. That's a <b>vowel</b> sound.</p>
  <p>Now say “b”, “t” and “s”. Your lips, tongue or teeth block or squeeze the air on its way out. Those are <b>consonant</b> sounds.</p>
  ${mouthHTML()}
  <div class="vc">
   <div><span class="eyebrow">Vowel letters</span><div class="letters">${'aeiou'.split('').map(c=>`<span class="lt v">${c}</span>`).join('')}</div></div>
   <div><span class="eyebrow">Consonant letters</span><p class="meta">The other 21 letters of the alphabet.</p></div>
  </div>
  <p>Every syllable needs a vowel sound, so every word needs a letter doing the vowel job. Look at these words, with the vowel letters shaded:</p>
  <div class="wordgrid">
   <div><span class="sw">${letters('struct')}${spk('struct')}</span><span class="cap">One vowel letter holding up five consonants.</span></div>
   <div><span class="sw">${letters('yes',false)}${spk('yes')}</span><span class="cap">At the start of a word, ${g('y')} is a consonant.</span></div>
   <div><span class="sw">${letters('busy',true)}${spk('busy')}</span><span class="cap">At the end, ${g('y')} does the vowel job.</span></div>
   <div><span class="sw">${letters('rhythm',true)}${spk('rhythm')}</span><span class="cap">No a, e, i, o or u, so ${g('y')} steps in as the vowel.</span></div>
  </div>
  <p>So ${g('y')} can do both jobs, depending on where it sits in the word.</p>
  <div class="detective"><span class="eyebrow">Word detective: the names explain themselves</span>
   <p>The word ${sw('consonant')} is built from parts:</p>
   ${A('con+son+ant')}
   <p><b>con</b> “with” + <b>son</b> “sound” + <b>ant</b> “one that does it”. A consonant is a sound that sounds <i>with</i> another one. That’s why a consonant needs a vowel beside it to be heard clearly.</p>
   <p>${sw('vowel')} comes from Latin <i>vōcālis</i>, “of the voice”, like ${sw('vocal')} and ${sw('voice')}. A vowel is the open sound of your voice.</p>
  </div>
  <h3 style="font-size:1.2rem">Why this matters for spelling</h3>
  <div class="detective"><span class="eyebrow">Word detective: what is a suffix?</span>
   <p>The next part uses the word ${sw('suffix')}. It’s built from parts too:</p>
   ${A('suf+fix')}
   <p><b>suf</b> “under, after” + <b>fix</b> “fastened”: a piece fastened <i>after</i> the base. Its partner is a ${sw('prefix')}:</p>
   ${A('pre+fix')}
   <p><b>pre</b> “before” + <b>fix</b>: a piece fastened <i>before</i> the base. You’ll use both all through the app.</p>
  </div>
  <p>When you add a suffix, the first letter of the suffix decides what happens at the join. Compare:</p>
  ${A('move+ing')}${A('move+ment')}
  <p>${g('ing')} starts with a vowel letter, so the ${g('e')} of <i>move</i> drops. ${g('ment')} starts with a consonant letter, so it stays. You'll meet this rule properly in a later lesson.</p>
  <div class="panel"><span class="eyebrow">Try it: tap each suffix to check your guess</span>
   <p class="meta">Does it start with a vowel letter or a consonant letter?</p>
   <div class="bank-tiles">${VS.map(([s,t])=>vsShown.has(s)?`<span class="vs-ans ${t}"><span class="tile suffix"><span class="fl ${t}">${s[0]}</span>${s.slice(1)}</span>starts with a ${t==='v'?'vowel':'consonant'}</span>`:`<button class="tile suffix" data-vs="${s}">${s}</button>`).join('')}</div>
   ${vsShown.has('y')?`<p class="meta">The suffix ${g('y')} counts as a vowel suffix: nose/ + y → nosy.</p>`:''}
  </div>`},
 {k:'Why it works',t:'Spelling carries meaning',h:()=>`
  <p>English spelling records meaning as well as sound. Words that share meaning usually share spelling, even when they sound different.</p>
  <p>Say ${sw('sign')}, then ${sw('signal')}. The ${g('g')} is silent in one and spoken in the other. It's spelled in both because they share the same base.</p>
  ${A('sign+al')}${A('sign+ature')}
  <p class="tip">When a spelling seems strange, look for a relative where the letter makes sense.</p>`},
 {k:'Building blocks',t:'Three kinds of morpheme',h:()=>`
  <p>A morpheme is the smallest part of a word that carries meaning. Spelling is built from three kinds.</p>
  <div class="legend">
   <div><span class="tile prefix">re</span><span><b>Prefix.</b> Goes before the base and adds to its meaning: <i>re</i> means “again” or “back”.</span></div>
   <div><span class="tile base">act</span><span><b>Base.</b> The core meaning. Every word has at least one.</span></div>
   <div><span class="tile suffix">ion</span><span><b>Suffix.</b> Goes after the base. It often changes the word's job: <i>act</i> (a verb) becomes <i>action</i> (a noun).</span></div>
  </div>
  ${A('re+act+ion')}
  <p>Some bases can stand alone, like <i>act</i>. Others are <b>bound</b> and always need company, like ${g('struct')} in <i>construct</i>.</p>
  <h3 style="font-size:1.15rem">Where the names come from</h3>
  <p>Prefixes and suffixes together are called <b>affixes</b>: pieces fastened <i>to</i> a base.</p>
  ${A('af+fix')}
  <p>Look closely at ${g('suf')} and ${g('af')}. They are really the Latin prefixes <i>sub</i> and <i>ad</i>, changed to match the ${g('f')} that follows. You’ll see the same thing in ${sw('assign')} (<i>ad</i> → <i>as</i> before s) and ${sw('import')} (<i>in</i> → <i>im</i> before p).</p>
  <p>And ${sw('morpheme')} comes from Greek <i>morphē</i>, “form”: the smallest piece of a word with its own form and meaning.</p>
  <div class="row"><button class="speak" data-gofam="fix">Explore the fix family</button></div>`},
 {k:'The main tool',t:'Word sums',h:()=>`
  <p>A word sum shows how a word is built, piece by piece.</p>
  ${A('con+struct+ion')}
  <ul><li><b>+</b> joins the elements.</li><li><b>→</b> means “rewrites as”: the finished spelling.</li></ul>
  <p>When you check a spelling, name the letters, not their sounds. Tap <b>Say</b> to hear the finished word, then <b>Spell</b> to hear its letters: c‑o‑n‑s‑t‑r‑u‑c‑t‑i‑o‑n.</p>
  <div class="row">${spellBtn('con+struct+ion')}</div>
  <p class="tip">Most of the time you just join the pieces. Three changes can happen at the join. The next three lessons cover them.</p>`},
 {k:'Change 1 of 3',t:'Dropping the final e',h:()=>`
  <p>When a base ends in a silent ${g('e')} and the suffix starts with a vowel letter, the ${g('e')} is dropped. A slash marks where it goes.</p>
  <div class="pair"><div class="panel"><span class="cap">Vowel suffix: drop the e</span>${A('move+ing')}${A('hope+ed')}</div>
  <div class="panel"><span class="cap">Consonant suffix: keep it</span>${A('move+ment')}${A('care+ful')}</div></div>
  <p>The ${g('e')} isn't lost from the base. You can still see it in <i>movement</i> and <i>moves</i>.</p>`},
 {k:'Change 2 of 3',t:'Changing y to i',h:()=>`
  <p>When a base ends in a consonant then ${g('y')}, the ${g('y')} changes to ${g('i')} before most suffixes. It's marked <b>/i</b>.</p>
  ${A('busy+ness')}${A('busy+ly')}${A('carry+ed')}
  <p>The exception: keep the ${g('y')} when the suffix starts with ${g('i')}, so you never write <i>ii</i>.</p>
  ${A('carry+ing')}
  <p class="tip">${sw('business')} sounds nothing like ${sw('busy')}, but the word sum shows it's just <i>busy + ness</i>.</p>`},
 {k:'Change 3 of 3',t:'Doubling the consonant',h:()=>`
  <p>When a short base ends in <b>one vowel letter then one consonant</b>, double that consonant before a vowel suffix. The extra letter goes in brackets.</p>
  <div class="pair"><div class="panel"><span class="cap">hop: one vowel, one consonant</span>${A('hop+ing')}${A('run+er')}</div>
  <div class="panel"><span class="cap">hope: ends in e, so drop it</span>${A('hope+ing')}${A('hop+s')}</div></div>
  <p>Doubling keeps <i>hopping</i> and <i>hoping</i> apart. A consonant suffix like ${g('s')} never causes doubling.</p>
  <p class="meta">In longer words, double only when the last syllable is stressed: <i>begin</i> → <i>beginning</i>, but <i>visit</i> → <i>visiting</i>.</p>`},
 {k:'Going further',t:'Trickier joins',h:()=>`
  <p>Once you know the three main changes, a few more patterns explain many words that look odd at first. Each follows a rule you can use again.</p>
  <h3 style="font-size:1.15rem">‹le› + ‹ly›</h3>
  <p>When ${g('ly')} joins a word ending in ${g('le')}, the ${g('le')} drops.</p>
  ${A('simple+ly')}${A('rely+able+ly')}
  <h3 style="font-size:1.15rem">‹ie› before ‹ing›</h3>
  <p>${g('ie')} becomes ${g('y')} before ${g('ing')}, so you never write ${g('ii')}.</p>
  ${A('lie+ing')}
  <h3 style="font-size:1.15rem">Keeping the ‹e›</h3>
  <p>A soft ${g('c')} or ${g('g')} keeps its ${g('e')} before ${g('a')} or ${g('o')}. Without it, the letter would sound hard, as in ${sw('cat')} or ${sw('go')}.</p>
  ${A('notice+able')}${A('courage+ous')}
  <h3 style="font-size:1.15rem">‹c› becomes ‹ck›</h3>
  <p>A ${g('k')} is added after ${g('c')} before ${g('e')}, ${g('i')} or ${g('y')}, so the ${g('c')} stays hard.</p>
  ${A('picnic+ing')}

function newRound(){
  let pool=poolKeys().filter(k=>k.includes('+')&&unlockedKey(k));
  if(!pool.length)pool=Object.keys(FAM).filter(k=>k.includes('+')&&unlockedKey(k));
  const due=shuffle(Object.keys(review).filter(k=>pool.includes(k))).slice(0,3);
  const keys=[...due,...shuffle(pool.filter(k=>!due.includes(k)))];
  const builds=[],chooses=[],used=new Set();
  due.forEach((k,i)=>{if(i%2===0){builds.push({...genBuild(k),review:true});used.add(k);}else{const q=genChoose(k);if(q){chooses.push({...q,review:true});used.add(k);}}});
  const lvlFirst=shuffle(keys.filter(k=>wordLevel(k)===level));
  for(const k of [...lvlFirst.slice(0,3),...keys]){if(builds.length>=4)break;if(used.has(k))continue;builds.push(genBuild(k));used.add(k);}
  for(const k of [...lvlFirst,...keys]){if(chooses.length>=2)break;if(used.has(k))continue;const q=genChoose(k);if(q){chooses.push(q);used.add(k);}}
  const cls=[];for(const k of keys){if(used.has(k))continue;const q=genClsSuffix(k);if(q){cls.push(q);used.add(k);break;}}
  for(const k of shuffle(keys)){if(cls.length>=2)break;if(used.has(k))continue;const q=genClsWord(k);if(q){cls.push(q);used.add(k);}}
  const whys=shuffle(P_WHY).slice(0,10-builds.length-chooses.length-cls.length).map(x=>({type:'why',...x,opts:shuffle(x.o)}));
  round={qs:shuffle([...builds,...chooses,...cls,...whys]),i:0,score:0,picked:null,checked:false,levelUp:0};
}
const LV_WORDS={1:'words with no change at the join',2:'words where the final ‹e› drops',3:'words where ‹y› changes to ‹i›',4:'words with a doubled consonant',5:'words with the trickier joining changes'};
function levelNote(){
  if(level>=LEVELS.length)return `<p class="meta">All levels unlocked.</p>`;
  const left=Math.max(UNLOCK_AT-(lvlCorrect[level]||0),0);
  const avail=poolKeys().filter(k=>k.includes('+')&&unlockedKey(k)&&wordLevel(k)===level).length;
  const block=avail?'':`<p class="verdict bad">Your chosen families have no ${LV_WORDS[level].replace('words ','')} words. Choose bases → All to keep levelling up.</p>`;
  return `<p class="meta">Get <b>${left}</b> more ${LV_WORDS[level]} right to unlock <b>${LEVELS[level].name}</b> (${LEVELS[level].fam.join(', ')}). Most questions in each round now use these words.</p>${block}`;
}
function levelsHTML(){

    const st=l.n<level?'done':l.n===level?'now':'locked';
    const prog=l.n===level&&level<LEVELS.length?`<span class="lv-prog">${Math.min(lvlCorrect[level]||0,UNLOCK_AT)}/${UNLOCK_AT}</span>`:'';
    return `<div class="lv ${st}" title="${l.fam.join(', ')}"><span class="lv-n">${st==='done'?'✓':st==='locked'?LOCK:l.n}</span><span class="lv-name">${l.name}</span>${prog}</div>`;}).join('')}</div>

}

let custom=store.get('custom',{}); // key -> 'word class|definition'
function addCustom(k,pos,def){const w=joinSum(parse(k)).res;KNOWN.add(k);DEFS[w]=DEFS[w]||`${pos}|${def}`;FAM[k]=k.split('+').find(x=>BASES[x]);custom[k]=`${pos}|${def}`;store.set('custom',custom);}
Object.entries(custom).forEach(([k,v])=>{const w=joinSum(parse(k)).res;KNOWN.add(k);if(!DEFS[w])DEFS[w]=v;FAM[k]=k.split('+').find(x=>BASES[x]);});

async function challenge(key){
  const parts=parse(key),w=joinSum(parts).res;
  chal={key,status:'asking'};holdWord=true;renderBuild();
  const prompt=`You are checking a spelling app for learners. Is "${w}" a real, standard English word found in a standard British English dictionary (not a proper noun, abbreviation or obsolete form)? It was built from these morphemes: ${parts.map(p=>p.s+' ('+p.t+')').join(' + ')}.
Reply with only a JSON object, for example {"isWord":true,"spelling":"${w}","builtFromTheseParts":true,"partOfSpeech":"noun","definition":"A short, simple definition for a learner."}
- isWord: true only if "${w}" is a real word spelled exactly like that.
- spelling: the correct dictionary spelling of the word these parts are trying to make.
- builtFromTheseParts: true if the word really is made of these parts.
- partOfSpeech: e.g. noun, verb, adjective, adverb (may list two).
- definition: one short, simple sentence for a learner, without using the word itself.`;
  try{
    const r=await sampleFn.json(prompt,{modelTier:'default'});
    if(chal?.key!==key)return;
    const ok=r&&r.isWord===true&&String(r.spelling||'').toLowerCase()===w&&r.builtFromTheseParts!==false;
    if(ok){addCustom(key,String(r.partOfSpeech||'word').toLowerCase(),String(r.definition||'').trim()||'A real English word.');chal={key,status:'added'};}
    else if(r&&r.isWord===false&&r.spelling&&String(r.spelling).toLowerCase()!==w)chal={key,status:'no',msg:`Claude says this isn't a word. The parts would make <b>${String(r.spelling)}</b>, which needs a different spelling, so this word sum doesn't produce it.`};
    else if(r&&r.isWord===true&&r.builtFromTheseParts===false)chal={key,status:'no',msg:`<b>${w}</b> is a word, but Claude says it isn't really built from these parts, so it isn't added.`};
    else chal={key,status:'no',msg:`Claude doesn't recognise <b>${w}</b> as a standard English word.`};
  }catch(e){
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e?.code))sampleOff=true;
    chal={key,status:'err',msg:e?.code==='rate_limited'?'Too many checks for now. Try again in a little while.':e?.code==='not_granted'?'Checking with Claude wasn’t allowed, so this word can’t be checked.':'The check didn’t work this time. You can try again.'};
  }
  if(!document.getElementById('build').hidden)renderBuild();
}

const normWord=v=>String(v||'').toLowerCase().replace(/[^a-z]/g,'').slice(0,30);
function decompose(w){
  const out=new Set(),B=Object.keys(BASES);
  (function dfs(parts,hasBase,np,ns){
    let r='';
    if(parts.length){r=joinSum(parse(parts.join('+'))).res;
      if(hasBase&&r===w){out.add(parts.join('+'));return;}
      if(r.length>w.length||!w.startsWith(r.slice(0,-2)))return;}
    if(!hasBase){if(np<2)for(const x of PREFIXES)dfs([...parts,x],false,np+1,0);for(const x of B)dfs([...parts,x],true,np,0);}
    else if(ns<4)for(const x of SUFFIXES)dfs([...parts,x],true,np,ns+1);
  })([],false,0,0);
  // drop splits that only work by dropping an e before -es (reliance + es): -s is the real suffix there
  const ok=[...out].filter(k=>{const ps=k.split('+'),j=joinSum(parse(k));return !ps.some((x,i)=>x==='es'&&j.ch[i]==='e');});
  // how many leading parts already make a known word (rely+ance in rely+ance+s)
  const stem=k=>{const ps=k.split('+');for(let n=ps.length;n>0;n--)if(KNOWN.has(ps.slice(0,n).join('+')))return n;return 0;};
  ok.sort((a,b)=>(KNOWN.has(b)-KNOWN.has(a))||(stem(b)-stem(a))||(a.split('+').length-b.split('+').length));
  // if the best split is a known word, only offer other known splits as alternatives
  if(ok.length&&KNOWN.has(ok[0]))return ok.filter(k=>KNOWN.has(k));
  return ok.length&&stem(ok[0])?ok.filter(k=>stem(k)).slice(0,3):ok.slice(0,3);
}

let dlFn=null;try{window.claude?.use?.('downloads').then(f=>{dlFn=f;}).catch(()=>{});}catch(_){}
const plainSum=k=>{const j=joinSum(parse(k));return j.toks.map(t=>t.dbl?`(${t.dbl})`:t.s+(t.mark||'')).join(' + ');};
const RULE_SHORT={e:'dropping the final e',y:'y to i',d:'doubling',ds:'doubling in longer words',u:'doubling in longer words',le:'le + ly',ie:'ie to y',k:'keeping e for a soft c or g',ck:'c to ck',ll:'British l doubling'};
function reportData(){
  const mk=Object.entries(stats).filter(([k,v])=>v.c>=1&&(v.w===0||v.c>=2)&&!review[k]).map(([k])=>k);
  const byYear={};mk.forEach(k=>{if(k.includes('+')){const y=yearOf(k).y;byYear[y]=(byYear[y]||0)+1;}});
  const rv=Object.keys(review);const rules={};
  rv.forEach(k=>joinSum(parse(k)).notes.forEach(n=>{const r=RULE_SHORT[n];if(r)rules[r]=(rules[r]||0)+1;}));
  const comp=MATRICES.filter(m=>foundIn(m)===m.list.length).length,tf=MATRICES.reduce((a,m)=>a+foundIn(m),0),tn=MATRICES.reduce((a,m)=>a+m.list.length,0);
  return {name:store.get('repName',''),date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),
    level,levelName:LEVELS[level-1].name,next:level<LEVELS.length?{name:LEVELS[level].name,got:Math.min(lvlCorrect[level]||0,UNLOCK_AT)}:null,
    answers:totals.a,acc:totals.a?Math.round(totals.c/totals.a*100):null,best:store.get('best',0),mastered:mk.length,byYear,
    review:rv.map(k=>({w:joinSum(parse(k)).res,sum:plainSum(k)})),rules:Object.entries(rules).sort((a,b)=>b[1]-a[1]),
    comp,fams:MATRICES.length,tf,tn,bScore,bWords:bWords.size};
}
function reportText(){const D=reportData();const L=[];
  L.push('Morpheme Workshop: progress report');
  if(D.name)L.push('Learner: '+D.name);
  L.push('Date: '+D.date,'');
  L.push(`Level: ${D.level} of ${LEVELS.length} (${D.levelName})`+(D.next?`, ${D.next.got} of ${UNLOCK_AT} towards ${D.next.name}`:', all levels unlocked'));
  L.push(`Practice: ${D.answers} answers`+(D.acc!==null?`, ${D.acc}% correct`:'')+`, best round ${D.best} out of 10`);
  L.push(`Words mastered: ${D.mastered}`+(Object.keys(D.byYear).length?' ('+Object.entries(D.byYear).map(([y,n])=>`${YLABEL[y]}: ${n}`).join(', ')+')':''));
  L.push(`Words to review: ${D.review.length}`);D.review.slice(0,30).forEach(r=>L.push(`  ${r.w}  (${r.sum})`));
  if(D.rules.length)L.push('Changes to practise: '+D.rules.map(([r,n])=>`${r} (${n})`).join(', '));
  L.push(`Word families: ${D.comp} of ${D.fams} complete, ${D.tf} of ${D.tn} words found`);
  L.push(`Word sums built: ${D.bWords} words, ${D.bScore} points`);
  const sgg=store.get('suggest',[]);if(sgg.length)L.push('Words the learner thinks are missing from the app: '+sgg.join(', '));
  const cs=Object.entries(store.get('chstars',{})).map(([k,v])=>[skillOf(k).name,Object.values(v).reduce((a,b)=>a+b,0)]).filter(x=>x[1]);if(cs.length)L.push('Challenge stars: '+cs.map(([n,v])=>`${n} ${v}`).join(', '));
  return L.join('\n');}
function renderReport(){const D=reportData();const el=document.getElementById('reportIn');
  el.innerHTML=`<div class="rep-head"><h2 style="font-size:1.3rem">Progress report</h2><button class="mpop-x" data-closereport aria-label="Close">✕</button></div>
   <div class="setting"><label for="repName">Learner’s name (optional)</label></div>
   <input id="repName" class="rep-name" type="text" maxlength="60" autocomplete="off" value="${D.name.replace(/"/g,'&quot;')}" placeholder="Add a name for the teacher">
   <div class="pstats"><div><b>${D.level}</b><span>level of ${LEVELS.length}</span></div><div><b>${D.mastered}</b><span>words mastered</span></div><div><b>${D.acc!==null?D.acc+'%':'–'}</b><span>accuracy</span></div><div><b>${D.review.length}</b><span>to review</span></div></div>
   <dl class="rep">
    <dt>Level</dt><dd>${D.levelName}${D.next?` · ${D.next.got} of ${UNLOCK_AT} towards ${D.next.name}`:' · all unlocked'}</dd>
    <dt>Practice</dt><dd>${D.answers} answers · best round ${D.best} out of 10</dd>
    ${Object.keys(D.byYear).length?`<dt>Mastered by year</dt><dd>${Object.entries(D.byYear).map(([y,n])=>`<span class="ytag y${y}">${YSHORT[y]}</span> ${n}`).join(' &nbsp; ')}</dd>`:''}
    ${D.rules.length?`<dt>Changes to practise</dt><dd>${D.rules.map(([r,n])=>`${r} (${n})`).join(', ')}</dd>`:''}
    ${D.review.length?`<dt>Words to review</dt><dd>${D.review.slice(0,12).map(r=>`<b>${r.w}</b> <span class="meta">${r.sum}</span>`).join('<br>')}${D.review.length>12?`<br><span class="meta">and ${D.review.length-12} more in the copied report</span>`:''}</dd>`:''}
    <dt>Word families</dt><dd>${D.comp} of ${D.fams} complete · ${D.tf} of ${D.tn} words found</dd>
    <dt>Word sums</dt><dd>${D.bWords} words built · ${D.bScore} points</dd>
    ${store.get('suggest',[]).length?`<dt>Suggested words</dt><dd>${store.get('suggest',[]).join(', ')}</dd>`:''}
   </dl>
   <div class="row"><button class="btn primary" data-copyreport>Copy report</button>${dlFn?'<button class="btn" data-savereport>Save as a file</button>':''}<span class="rep-status" id="repStatus" aria-live="polite"></span></div>
   <textarea id="repText" class="rep-text" readonly hidden></textarea>
   <p class="meta">Progress is saved only in this browser. Copy the report to send it to a teacher.</p>`;}
async function copyReport(){const t=reportText(),st=document.getElementById('repStatus'),ta=document.getElementById('repText');
  try{await navigator.clipboard.writeText(t);st.textContent='Copied';}
  catch(e){ta.value=t;ta.hidden=false;ta.focus();ta.select();st.textContent='Select all and copy the text below';}}
async function saveReport(){const st=document.getElementById('repStatus');const n=(store.get('repName','')||'learner').replace(/[^\w\- ]/g,'').trim()||'learner';
  const d=new Date(),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try{await dlFn.save({filename:`Morpheme Workshop progress - ${n} - ${ds}.txt`,data:reportText()});st.textContent='Saved';}
  catch(e){st.textContent=e?.code==='declined'?'':'Saving isn’t available here. Use Copy report instead.';}}

/* ---------- tabs, settings, events ---------- */
const TABS=['learn','build','split','matrix','origins','practice'];
const RENDER={learn:renderLearn,build:renderBuild,split:renderSplit,matrix:renderMatrix,origins:renderOrigins,practice:renderPractice};
function show(tab,scroll=true){
  TABS.forEach(t=>{document.getElementById(t).hidden=t!==tab;document.getElementById('tab-'+t).setAttribute('aria-selected',t===tab);});
  RENDER[tab]();store.set('tab',tab);if(scroll)window.scrollTo({top:0});
}
function applySettings(){
  const s=store.get('settings',{size:'normal',space:'normal'});
  document.documentElement.classList.toggle('large',s.size==='large');document.body.classList.toggle('spaced',s.space==='wide');
  document.querySelectorAll('#segSize button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===s.size));
  document.querySelectorAll('#segSpace button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===s.space));
  const cl=store.get('classes',true)?'show':'hide';document.querySelectorAll('#segCls button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===cl));
  const r=String(store.get('rate',1));document.querySelectorAll('#segRate button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===r));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b){const mb=e.target.closest('.mx-base');if(mb){const m=morphFrom(mb);if(m)showPop(m);return;}
    const pc=e.target.closest('#build .wordpanel .grp[data-g]');if(pc&&bMode!=='ch'){selectPiece(+pc.dataset.g);return;}
    const st=e.target.closest('.anim[data-play="1"] .stage');if(st)playAnim(st.closest('.anim'));return;}
  const d=b.dataset;
  if(d.tab)return show(d.tab);
  if(d.go)return show(d.go);
  if(d.spell!==undefined)return spellOut(d.spell);
  if(d.cls){showClsPop(d.cls.split('|'));return;}
  if(d.popclose!==undefined){document.getElementById('mpop').hidden=true;return;}
  if(d.say!==undefined)return sayWord(d.say);
  if(d.sayw){if(b.closest('summary'))e.preventDefault();return speak(sayText(d.sayw),.8);}
  if(d.mouth)return setMouth(d.mouth);
  if(d.playanim!==undefined)return playAnim(b.closest('.anim'));
  if(d.stepanim!==undefined){let el=b.closest('.anim');const s=ANIM.get(el);
    if(s)s.run++;if(el.querySelector('.stage.done'))return resetAnim(el);return animStep(el);}
  if(d.vs){vsShown.add(d.vs);return renderLearn();}
  if(d.lesson!==undefined){const i=+d.lesson;if(i>=0&&i<LESSONS.length){lessonIdx=i;renderLearn();window.scrollTo({top:0});}return;}
  if(d.add&&bMode==='guide'&&!gUnlock&&b.classList.contains('dim')){showAddOption(d.add);return;}
  if(d.rm!==undefined){removeAt(+d.rm);swapIdx=null;lastBuilt=null;holdWord=false;store.set('build',buildParts);return renderBuild();}
  if(d.swap!==undefined){swapIdx=swapIdx===+d.swap?null:+d.swap;return renderBuild();}
  if(d.swapcancel!==undefined){swapIdx=0===swapIdx?0:swapIdx;selectPiece(swapIdx);return;}
  if(d.add&&swapIdx!=null&&swapIdx<buildParts.length){swapAt(swapIdx,d.add);swapIdx=null;lastBuilt=null;holdWord=false;store.set('build',buildParts);return renderBuild();}
  if(d.add&&!buildDemo&&buildParts.length&&suffixSwap(d.add)){lastBuilt=null;holdWord=false;swapIdx=null;store.set('build',buildParts);renderBuild();swapNote='';return;}
  if(d.add){if(buildDemo)endDemo();lastBuilt=null;holdWord=false;swapIdx=null;if(bMode==='guide'){if(!buildParts.length)gTap=[];gTap.push(d.add);buildParts=arrange(gTap);}else buildParts.push(d.add);store.set('build',buildParts);return renderBuild();}
  if(d.challenge!==undefined){if(sampleFn&&!sampleOff)challenge(buildParts.join('+'));return;}
  if(d.splitword){doSplit(d.splitword,d.auto==='1');return;}
  if(d.splitalt!==undefined){split.idx=+d.splitalt;return renderSplit();}
  if(d.splitask!==undefined){if(split&&sampleFn&&!sampleOff)askClaudeSplit(split.w);return;}
  if(d.gofam){const k=d.gofam,b=k.split('+').find(x=>MATRICES.some(m=>m.base===x)),i=MATRICES.findIndex(m=>m.base===b);
    if(i>=0){const m=MATRICES[i];mxIdx=i;store.set('mx',i);mxSel=selFromKey(m,m.list.includes(k)?k:m.start);mxNew='';reveal=false;}return show('matrix');}
  if(d.bmode){bMode=d.bmode;store.set('bmode',bMode);gTap=[...buildParts];gUnlock=false;return renderBuild();}
  if(d.chskill){chSkill=d.chskill;store.set('chskill',chSkill);return renderBuild();}
  if(d.chtimer){chTimer=d.chtimer==='on';store.set('chtimer',chTimer);return renderBuild();}
  if(d.chlevel){startChallenge(+d.chlevel);return window.scrollTo({top:0});}
  if(d.chadd)return chAdd(d.chadd);
  if(d.chundo!==undefined){if(ch){chTok++;ch.parts.pop();ch.msg='';renderBuild();}return;}
  if(d.chclear!==undefined){if(ch){chTok++;ch.parts=[];ch.msg='';renderBuild();}return;}
  if(d.chfinish!==undefined)return finishChallenge();
  if(d.chnext!==undefined){startChallenge(ch.level+1);return window.scrollTo({top:0});}
  if(d.chretry!==undefined){startChallenge(ch.level);return window.scrollTo({top:0});}
  if(d.chquit!==undefined){clearInterval(chTick);ch=null;return renderBuild();}
  if(d.addopt){const x=d.addopt;document.getElementById('mpop').hidden=true;gUnlock=true;lastBuilt=null;holdWord=false;swapIdx=null;
    if(!buildParts.length)gTap=[];gTap.push(x);buildParts=arrange(gTap);store.set('build',buildParts);return renderBuild();}
  if(d.gunlock!==undefined){gUnlock=true;return renderBuild();}
  if(d.glock!==undefined){gUnlock=false;return renderBuild();}
  if(d.suggest){const sg=store.get('suggest',[]);if(!sg.includes(d.suggest)){sg.push(d.suggest);store.set('suggest',sg);}holdWord=true;return renderBuild();}
  if(d.keep!==undefined){holdWord=true;b.closest('.clearbar')?.remove();return;}
  if(d.undo!==undefined){swapIdx=null;if(buildDemo){endDemo();return renderBuild();}if(!buildParts.length&&lastBuilt){buildParts=lastBuilt;gTap=[...buildParts];lastBuilt=null;holdWord=true;store.set('build',buildParts);return renderBuild();}if(bMode==='guide'){gTap.pop();buildParts=arrange(gTap);}else buildParts.pop();store.set('build',buildParts);return renderBuild();}
  if(d.clear!==undefined){if(buildDemo)endDemo();holdWord=false;buildParts=[];gTap=[];swapIdx=null;gUnlock=false;store.set('build',buildParts);return renderBuild();}
  if(d.mx!==undefined){mxIdx=+d.mx;mxSel=null;reveal=false;mxNew='';store.set('mx',mxIdx);return renderMatrix();}
  if(d.k){const m=MATRICES[mxIdx],c=+d.c;mxSel[d.k][c]=mxSel[d.k][c]===d.x?null:d.x;
    const key=keyFromSel(m,mxSel);mxNew='';
    if(m.list.includes(key)){const arr=found[m.base]||(found[m.base]=[]);if(!arr.includes(key)){arr.push(key);mxNew=key;store.set('found',found);}}
    return renderMatrix();}
  if(d.load){mxSel=selFromKey(MATRICES[mxIdx],d.load);mxNew='';return renderMatrix();}
  if(d.reveal!==undefined){reveal=!reveal;return renderMatrix();}
  const R=round;
  if(d.pick!==undefined){const q=R.qs[R.i],a=q.ans,e=a.indexOf(null);if(e>=0)a[e]=+d.pick;
    if(!a.includes(null)){R.checked=true;const ok=a.map(i=>q.pool[i]).join('+')===q.k;if(ok)R.score++;R.levelUp=record(q.k,ok);}
    return renderPractice();}
  if(d.unpick!==undefined){R.qs[R.i].ans[+d.unpick]=null;return renderPractice();}
  if(d.check!==undefined){const q=R.qs[R.i];R.checked=true;const ok=q.ans.map(i=>q.pool[i]).join('+')===q.k;if(ok)R.score++;R.levelUp=record(q.k,ok);return renderPractice();}
  if(d.opt!==undefined){const q=R.qs[R.i];R.picked=d.opt;R.checked=true;const ok=d.opt===q.o[0];if(ok)R.score++;R.levelUp=q.k?record(q.k,ok):0;return renderPractice();}
  if(d.next!==undefined){R.i++;R.checked=false;R.picked=null;R.levelUp=0;renderPractice();return window.scrollTo({top:0});}
  if(d.wotdhide!==undefined){store.set('wotdHidden',todayKey());return renderLearn();}
  if(d.wotdshow!==undefined){store.set('wotdHidden','');return renderLearn();}
  if(d.wotdgo){const k=d.wotdgo,i=MATRICES.findIndex(m=>m.base===FAM[k]);if(i>=0){mxIdx=i;store.set('mx',i);mxSel=selFromKey(MATRICES[i],k);mxNew='';reveal=false;}return show('matrix');}
  if(d.newround!==undefined){newRound();return renderPractice();}
  if(d.listen!==undefined){listenMode=!listenMode;store.set('listen',listenMode);return renderPractice();}
  if(d.pchooser!==undefined){pChooser=!pChooser;if(pChooser)pCurric=false;return renderPractice();}
  if(d.pcurric!==undefined){pCurric=!pCurric;if(pCurric)pChooser=false;return renderPractice();}
  if(d.pyear!==undefined){pYear=+d.pyear;store.set('pyear',pYear);return renderPractice();}
  if(d.pbase){if(d.pbase==='__all')pBases=[];else pBases=pBases.includes(d.pbase)?pBases.filter(x=>x!==d.pbase):[...pBases,d.pbase];store.set('pbases',pBases);return renderPractice();}
  if(d.pstart!==undefined){pChooser=false;pCurric=false;newRound();renderPractice();return window.scrollTo({top:0});}
  if(b.id==='openSettings'){loadVoices();document.getElementById('settings').hidden=false;return;}
  if(b.id==='testVoice')return speak('interruption. i, n, t, e, r',.8);
  if(b.id==='openReport'||d.openreport!==undefined){renderReport();document.getElementById('report').hidden=false;return;}
  if(d.closereport!==undefined){document.getElementById('report').hidden=true;return;}
  if(d.copyreport!==undefined)return copyReport(b);
  if(d.savereport!==undefined)return saveReport(b);
  if(b.id==='closeSettings'){document.getElementById('settings').hidden=true;return;}
  if(d.v&&b.closest('#segCls')){store.set('classes',d.v==='show');applySettings();const cur=TABS.find(t=>!document.getElementById(t).hidden);if(cur)RENDER[cur]();return;}
  if(d.v&&b.closest('#segRate')){store.set('rate',+d.v);return applySettings();}
  if(d.v&&b.closest('.seg')){const s=store.get('settings',{size:'normal',space:'normal'});
    if(b.closest('#segSize'))s.size=d.v;else s.space=d.v;store.set('settings',s);applySettings();
    const cur=TABS.find(t=>!document.getElementById(t).hidden);if(cur)RENDER[cur]();}
});
document.getElementById('settings').addEventListener('click',e=>{if(e.target.id==='settings')e.target.hidden=true;});
document.getElementById('report').addEventListener('click',e=>{if(e.target.id==='report')e.target.hidden=true;});
document.addEventListener('change',e=>{if(e.target.id==='voiceSel'){store.set('voice',e.target.value);speak('interruption',.8);}});
document.addEventListener('input',e=>{if(e.target.id==='repName'){store.set('repName',e.target.value.slice(0,60));const t=document.getElementById('repText');if(t)t.value=reportText();}});
applySettings();
const hash=(location.hash||'').slice(1);
show(TABS.includes(hash)?hash:store.get('tab','learn'),false);
</script>
