<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Morpheme Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, one scrolling panel per tab, fixed bottom tab bar.
   Morpheme colours carry meaning everywhere: prefix = teal, base = blue, suffix = amber. */
:root{
  --bg:#EBF0F3; --surface:#F9FBFC; --ink:#1C2631; --muted:#556372; --line:#C8D3DC;
  --pre:#1E7566; --pre-bg:#D8EEE8;
  --base:#2B4C9E; --base-bg:#DDE5F8;
  --suf:#9E540F; --suf-bg:#F6E4CF;
  --good:#24724A; --good-bg:#D9EEE0; --bad:#AE372D; --bad-bg:#F6DCD8;
  --vow:#8A2B7C; --vow-bg:#F4DEF0; --con:#5E5C10; --con-bg:#EEEDCB;
  --display:"Bricolage Grotesque","Lexend",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11171E; --surface:#19212B; --ink:#E4EAF0; --muted:#98A6B4; --line:#2D3946;
  --pre:#6CC6B1; --pre-bg:#1C3732; --base:#93ABF2; --base-bg:#222E4B; --suf:#E8A867; --suf-bg:#3B2A1A;
  --good:#7FD3A2; --good-bg:#1B3427; --bad:#F19389; --bad-bg:#3D211F;
  --vow:#E79BD9; --vow-bg:#3A1F36; --con:#D8D46E; --con-bg:#33321A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#19212B; --ink:#E4EAF0; --muted:#98A6B4; --line:#2D3946;
  --pre:#6CC6B1; --pre-bg:#1C3732; --base:#93ABF2; --base-bg:#222E4B; --suf:#E8A867; --suf-bg:#3B2A1A;
  --good:#7FD3A2; --good-bg:#1B3427; --bad:#F19389; --bad-bg:#3D211F;
  --vow:#E79BD9; --vow-bg:#3A1F36; --con:#D8D46E; --con-bg:#33321A; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
html.large body{font-size:19.5px}
body.spaced{letter-spacing:.05em;word-spacing:.16em}
*{box-sizing:border-box}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--base);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
i{font-style:normal;font-weight:600}
.gr{font-family:var(--mono);font-weight:700;color:var(--base);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{display:flex;gap:2px;font-family:var(--mono);font-weight:700;font-size:.8rem}
.logo span{padding:1px 5px;border-radius:5px}
.logo .a{background:var(--pre-bg);color:var(--pre)} .logo .b{background:var(--base-bg);color:var(--base)} .logo .c{background:var(--suf-bg);color:var(--suf)}
.brand h1{font-size:1.15rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;font-weight:600;cursor:pointer}

/* page */
main{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
section{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted)}
.lede{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--base);border-color:var(--base);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.tip{border-left:4px solid var(--suf);padding:4px 0 4px 12px;color:var(--muted)}

/* tiles & word sums */
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;font-family:var(--mono);font-size:1.15rem}
.unit{display:inline-flex;align-items:center;white-space:nowrap}
.tile{display:inline-block;padding:.22em .55em;border-radius:9px;border:1.5px solid;font-family:var(--mono);font-weight:700;line-height:1.3}
.tile.prefix{color:var(--pre);background:var(--pre-bg);border-color:var(--pre)}
.tile.base{color:var(--base);background:var(--base-bg);border-color:var(--base)}
.tile.suffix{color:var(--suf);background:var(--suf-bg);border-color:var(--suf)}
.tile.dbl{color:var(--con);background:transparent;border:1.5px dashed var(--con)}
.mark{color:var(--bad);font-weight:700;padding-left:2px}
.mark.y{color:var(--vow)}
.chg{display:inline-block;border-radius:4px;padding:0 .08em;color:var(--surface)}
.chg.e{background:var(--bad)} .chg.y{background:var(--vow)} .chg.d{background:var(--con)}
.op{color:var(--muted);font-weight:700}
.arrow{padding-inline:4px}
.result{font-weight:700;font-size:1.3rem;padding:.1em .5em;border-radius:9px;background:var(--bg);border:1.5px solid var(--ink)}
.result.q{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted);margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:8px}
.notes li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-top:.6em}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.95rem}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.info{background:var(--bg);color:var(--muted)}
.def{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.def .pos{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted)}
.def p{max-width:60ch}
.mouth-box{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.mouth{width:100%;max-width:400px;height:auto;margin:0 auto;display:block}
.mouth-cap{font-size:.92rem;min-height:3em}
.m-skin{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.m-wall{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.m-floor{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4}
.m-tooth{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.m-tongue{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.8}
.m-label{font-family:var(--body);font-size:10.5px;fill:var(--muted);letter-spacing:0;word-spacing:0}
.m-tlabel{fill:var(--bad);font-weight:600}
#mJaw{transform-box:view-box;transform-origin:150px 95px;transform:rotate(3deg);transition:transform .45s ease}
#mLip{transition:transform .35s ease}
.tg{opacity:0;transition:opacity .35s}
#tg-low{opacity:1}
.m-t.closed #tg-low,.m-s #tg-low{opacity:0}
.m-t.closed #tg-t,.m-s #tg-s{opacity:1}
.m-aah #mJaw{transform:rotate(14deg)}
.m-b.closed #mJaw,.m-t #mJaw,.m-s #mJaw{transform:rotate(0deg)}
.m-b.closed #mLip{transform:translateY(-4px)}
.m-s #mLip,.m-t #mLip{transform:translateY(6px)}
#mTongue{transition:transform .45s ease}
.m-aah #mTongue{transform:translateY(16px)}
.m-b.release #mTongue{transform:translateY(6px)}
.m-t.release #mTongue{transform:translateY(5px)}
.m-b.release #mJaw{transform:rotate(7deg)}
.m-t.release #mJaw{transform:rotate(5deg)}
.air{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 9;opacity:0;transition:opacity .3s;animation:flow .8s linear infinite;stroke:var(--con)}
.m-arrowhead{fill:var(--con)}
.m-aah #air-free{stroke:var(--vow)}
.m-aah .m-arrowhead{fill:var(--vow)}
.m-aah #air-free,.m-b.release #air-free,.m-t.release #air-free,.m-b.closed #air-b,.m-t.closed #air-t,.m-s #air-s{opacity:1}
@keyframes flow{to{stroke-dashoffset:-32}}
.press{fill:var(--con);opacity:0;transform-box:fill-box;transform-origin:center}
.m-b.closed #press-b,.m-t.closed #press-t{opacity:.55;animation:press 1.2s ease-in infinite}
@keyframes press{0%{transform:scale(.4);opacity:.2}100%{transform:scale(1.3);opacity:.7}}
.fx{fill:none;stroke:var(--con);stroke-width:2;stroke-linecap:round;opacity:0;transition:opacity .25s}
.m-b.release #puff,.m-t.release #puff,.m-s #hiss{opacity:1}
.m-s #hiss{animation:hiss .3s steps(2) infinite}
@keyframes hiss{50%{transform:translateX(2px)}}
.letters{display:inline-flex;gap:4px;flex-wrap:wrap}
.lt{font-family:var(--mono);font-weight:700;font-size:1.25rem;min-width:1.7em;text-align:center;padding:.15em .2em;border-radius:7px;border:1.5px solid var(--line);background:var(--surface)}
.lt.v{background:var(--vow);color:var(--surface);border-color:var(--vow)}
.fl{display:inline-block;border-radius:5px;padding:0 .12em;margin-right:1px}
.fl.v{background:var(--vow);color:var(--surface)}
.fl.c{background:var(--con);color:var(--surface)}
.vc{display:grid;gap:14px}
.vc>div{display:flex;flex-direction:column;gap:6px}
.wordgrid{display:grid;gap:14px}
.wordgrid>div{display:flex;flex-direction:column;gap:6px}
.wordgrid .cap{font-size:.88rem;color:var(--muted)}
.vs-ans{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;padding:4px 10px 4px 4px;border-radius:10px}
.vs-ans.v{background:var(--vow-bg);color:var(--vow);border:1.5px solid var(--vow)}
.vs-ans.c{background:var(--con-bg);color:var(--con);border:1.5px solid var(--con)}
@media (min-width:560px){.wordgrid,.vc{grid-template-columns:1fr 1fr}}
.anim[data-play="1"] .stage{cursor:pointer}
.anim{display:flex;flex-direction:column;gap:8px}
.sec-title{font-size:1.35rem;font-weight:800}
.stage{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;font-family:var(--mono);font-weight:700;font-size:1.2rem;min-height:2.4rem}
.grp{display:inline-flex;padding:.18em .45em;border:1.5px solid;border-radius:9px;line-height:1.3;transition:border-radius .5s}
.grp.prefix{color:var(--pre);background:var(--pre-bg);border-color:var(--pre)}
.grp.base{color:var(--base);background:var(--base-bg);border-color:var(--base)}
.grp.suffix{color:var(--suf);background:var(--suf-bg);border-color:var(--suf)}
.grp.dblg{color:var(--con);border:1.5px dashed var(--con);transition:border-color .5s,padding .5s}
.grp.dblg.merged{border-color:transparent;padding-inline:0}
.br{display:inline-block;max-width:1em;overflow:hidden;transition:max-width .5s,opacity .4s}
.dblg.merged .br{max-width:0;opacity:0}
.al{display:inline-block;max-width:1em;overflow:hidden;border-radius:4px;transition:max-width .5s ease,opacity .5s ease,padding .5s}
.al.pulse{animation:pulse .8s ease}
@keyframes pulse{50%{transform:scale(1.4)}}
.al.gone{max-width:0;opacity:0;padding:0!important}
.al.swap{animation:flip .55s ease}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.mk{display:inline-block;max-width:2em;overflow:hidden;color:var(--bad);padding-left:2px;transition:max-width .5s,opacity .4s,padding .5s}
.mk.y{color:var(--vow)}
.mk.gone{max-width:0;opacity:0;padding:0}
.plus{display:inline-block;max-width:2em;margin:0 .4em;overflow:hidden;color:var(--muted);transition:max-width .5s ease,margin .5s ease,opacity .4s}
.plus.gone{max-width:0;margin:0;opacity:0}
.tail{display:inline-flex;align-items:center;gap:6px;margin-left:.4em;max-width:22em;overflow:hidden;white-space:nowrap;transition:max-width .6s,opacity .4s,margin .6s}
.stage.go .tail{max-width:0;opacity:0;margin:0}
.stage.done{animation:pop .4s ease}
.stage .grp{transition:border-radius .5s,background-color .6s,border-color .6s,color .6s,padding .6s}
.stage .al{transition:max-width .5s ease,opacity .5s ease,padding .5s,background-color .6s,color .6s}
.stage.plain .grp{background:transparent;border-color:transparent;color:var(--ink);padding-inline:0;border-radius:0}
.stage.plain .al.chg{background:transparent;color:var(--ink);padding:0}
.stage.plain{font-size:1.6rem;font-family:var(--body);font-weight:600}
.stage.plain .grp{border-width:0}
.anim-cap{font-size:.9rem;color:var(--muted);line-height:1.5}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl-end{display:inline-flex;gap:6px;margin-left:auto}
.speak:disabled{opacity:.45;cursor:default}
.verdict p{margin:0}
.vw{font-family:var(--mono);font-size:1.05rem}
.pos-inl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.8;margin-left:4px}
.newtag{font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--good);color:var(--surface);margin-left:4px}
.anim-cap .final{font-family:var(--mono);font-size:1.15rem;margin-right:6px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--base);cursor:pointer;vertical-align:middle;margin-left:4px;padding:0;flex:none}
.sw{white-space:nowrap}
.sayrow{display:flex;flex-wrap:wrap;gap:8px}
.saychip{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-weight:700;padding:2px 2px 2px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg)}
.optrow{display:flex;gap:8px;align-items:center}
.optrow .opt{flex:1}
.speak[aria-pressed="true"]{background:var(--base);border-color:var(--base);color:var(--surface)}
.listen{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hear{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;border:2px solid var(--base);background:var(--base-bg);color:var(--base);font-weight:600;font-size:1.05rem;cursor:pointer;min-height:52px}
.hear svg{width:22px;height:22px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bscore{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bscore b{font-family:var(--display);font-size:1.3rem;color:var(--base)}
.points{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--base-bg);color:var(--base)}
.points b{font-family:var(--display);font-size:1.4rem}
.points span{font-size:.85rem;opacity:.85}
.clearbar{display:flex;align-items:center;gap:10px;margin-top:4px}
.cb-track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cb-track span{display:block;height:100%;width:100%;background:var(--muted);transform-origin:left;animation:drain linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.challenge{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--base);font-size:.92rem}
.addedtag{margin:0 0 6px;font-size:.88rem;font-weight:600;color:var(--good)}
.speak{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}

/* legend */
.legend{display:grid;gap:12px}
.legend div{display:grid;grid-template-columns:5.5rem 1fr;gap:12px;align-items:start}
.legend .tile{justify-self:start}

/* lessons */
.lesson-head{display:flex;flex-direction:column;gap:6px}
.lesson-head h2{font-size:1.75rem;font-weight:800}
.lesson-body{display:flex;flex-direction:column;gap:14px;max-width:65ch}
.lesson-body ul,.lesson-body ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--base)}
.dot.done{background:var(--pre)}
.pair{display:grid;gap:10px}
.pair .cap{font-size:.85rem;color:var(--muted)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px}

/* builder */
.bank h3{font-family:var(--body);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted);margin-bottom:8px}
.bank-tiles{display:flex;flex-wrap:wrap;gap:8px}
button.tile{cursor:pointer;font-size:1rem;min-height:42px;min-width:44px}
button.tile:active{transform:translateY(1px)}
.empty{color:var(--muted);font-style:normal;font-size:.95rem}

/* matrix */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-weight:700;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--base);border-color:var(--base);color:var(--surface)}
.origin{font-size:.92rem;color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.tile,.mx-el,.mx-base,.grp{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mx-base{cursor:help}
.mpop{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;max-width:560px;margin:0 auto;background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgb(0 0 0 / .18);display:flex;flex-direction:column;gap:6px;animation:pop .25s ease}
.mpop p{margin:0}
.mpop-head{display:flex;align-items:flex-start;gap:10px}
.mpop-head p{flex:1;font-size:1.02rem}
.mpop-x{flex:none;margin:-6px -6px 0 0;border:0;background:transparent;font-size:1.1rem;width:36px;height:36px;cursor:pointer;color:var(--muted)}

.slots.done{display:block;border-style:solid;border-color:var(--line)}
.slot{display:inline-block;min-width:3.4em;height:2.35em;border:2px dashed;border-radius:9px}
.slot.prefix{border-color:var(--pre);background:var(--pre-bg)}
.slot.base{border-color:var(--base);background:var(--base-bg)}
.slot.suffix{border-color:var(--suf);background:var(--suf-bg)}
.slot-key{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.key{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px dashed;margin-left:6px}
.key.prefix{border-color:var(--pre);background:var(--pre-bg)} .key.base{border-color:var(--base);background:var(--base-bg)} .key.suffix{border-color:var(--suf);background:var(--suf-bg)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.qhead .eyebrow{margin:0}
.next-btn{flex:none;min-height:42px;padding:8px 14px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:.72rem;line-height:1.25;min-width:0}

.lv.done .lv-n{background:var(--good);color:var(--surface)}
.lv.now{border-color:var(--base)} .lv.now .lv-n{background:var(--base);color:var(--surface)}

.pstats span{font-size:.7rem;color:var(--muted);line-height:1.2}
.newbest{font-weight:700;color:var(--good)}
.rvtag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--vow-bg);color:var(--vow);letter-spacing:.06em}

.ring{width:20px;height:20px;flex:none}
.ring .rg-bg{fill:none;stroke:var(--line);stroke-width:3}
.ring .rg{fill:none;stroke:var(--pre);stroke-width:3;stroke-linecap:round}
.ring.done .rg{stroke:var(--good)}
.ring .rg-tick{fill:none;stroke:var(--good);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"] .rg-bg{stroke:rgb(255 255 255 / .35)} .chip[aria-pressed="true"] .rg,.chip[aria-pressed="true"] .rg-tick{stroke:var(--surface)}

.mx-col{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}

/* practice */

/* tab bar */

<script>
/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem('mw.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('mw.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- morphemes ---------- */
const PREFIXES=['re','de','in','con','un','im','as','inter','trans','ob','ex','sup','dis','pro','intro','cor','ab','e','non'];
const BASES={sign:{},struct:{bound:1},move:{},act:{},busy:{},port:{},form:{},spect:{bound:1},rupt:{bound:1},hope:{},stop:{dbl:1},rely:{},carry:{},hop:{dbl:1},run:{dbl:1},make:{},care:{}};
const SUFFIXES=['s','es','ed','ing','er','est','ly','ness','ful','less','al','ion','ive','ment','able','ance','ure','ate','ation','age','or','ator','acle','ify','ature','ist'];
const typeOf=s=>BASES[s]?'base':PREFIXES.includes(s)?'prefix':'suffix';
const mk=s=>({s,t:typeOf(s),dbl:!!(BASES[s]&&BASES[s].dbl)});
const parse=str=>str.split('+').map(mk);
const g=x=>`<span class="gr">&lt;${x}&gt;</span>`;

/* Join elements, applying the three suffixing changes. */
function joinSum(parts){
  let res='';const toks=[];const notes=[];const ch=[];const hl={};
  parts.forEach((p,i)=>{
    let c=null;
    if(i>0&&p.t==='suffix'){
      const vowel=/^[aeiouy]/.test(p.s), prevTok=toks[toks.length-1], prev=parts[i-1];
      if(/e$/.test(res)&&!/ee$/.test(res)&&vowel&&!(/[cg]e$/.test(res)&&/^[ao]/.test(p.s))){
        res=res.slice(0,-1);prevTok.mark='/';notes.includes('e')||notes.push('e');c='e';
      }else if(/[^aeiou]y$/.test(res)&&!/^i/.test(p.s)){
        res=res.slice(0,-1)+'i';prevTok.mark='/i';notes.includes('y')||notes.push('y');c='y';hl[res.length-1]='y';
      }else if(prev.dbl&&vowel){
        const d=res.slice(-1);hl[res.length-1]='d';res+=d;hl[res.length-1]='d';prevTok.dsrc=true;toks.push({dbl:d});notes.includes('d')||notes.push('d');c='d';
      }
    }
    ch.push(c);res+=p.s;toks.push({t:p.t,s:p.s});
  });
  return {res,toks,notes,ch,hl};
}
function sumHTML(parts,o={}){
  const j=joinSum(parts);const bits=[];
  j.toks.forEach((tk,i)=>{
    if(i>0)bits.push('<span class="op">+</span>');
    const k=tk.mark==='/'?'e':tk.mark==='/i'?'y':tk.dsrc?'d':null;
    const txt=k?`${tk.s.slice(0,-1)}<span class="chg ${k}">${tk.s.slice(-1)}</span>`:tk.s;
    bits.push(tk.dbl?`<span class="unit"><span class="tile dbl" title="doubled consonant">(<span class="chg d">${tk.dbl}</span>)</span></span>`
      :`<span class="unit"><span class="tile ${tk.t}">${txt}</span>${tk.mark?`<span class="mark ${k}">${tk.mark}</span>`:''}</span>`);
  });
  bits.push('<span class="op arrow">→</span>');
  const resTxt=j.res.split('').map((c,i)=>j.hl[i]?`<span class="chg ${j.hl[i]}">${c}</span>`:c).join('');
  bits.push(o.hide?'<span class="result q">?</span>':`<span class="result">${resTxt}</span>`);
  return `<div class="sum">${bits.join('')}</div>`;
}
const NOTE={
  e:()=>`The final ${g('e')} is dropped (marked <b>/</b>) because the next suffix starts with a vowel letter.`,
  y:()=>`The ${g('y')} changes to ${g('i')} (marked <b>/i</b>) because the next suffix doesn't start with ${g('i')}.`,
  d:()=>`The final consonant is doubled (shown in brackets) before a vowel suffix.`
};
const notesHTML=n=>n.length?`<ul class="notes">${n.map(k=>`<li><span>${NOTE[k]()}</span></li>`).join('')}</ul>`:'';
const canSpeak=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
const SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const spellBtn=key=>canSpeak?`<button class="speak" data-say="${key}">${SPK}Say</button><button class="speak" data-spell="${key}">${SPK}Spell</button>`:'';
// Respellings for words the device voice mispronounces. Add more here as they are found.
const SAY_AS={unmoved:'un-mooved',unmovable:'un-moovable',immovable:'im-moovable'};
const sayText=w=>SAY_AS[w.toLowerCase()]||w;
function speak(txt,rate){try{const u=new SpeechSynthesisUtterance(txt);u.rate=rate;u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const spk=w=>canSpeak?`<button class="spk" data-sayw="${w}" aria-label="Hear ${w}">${SPK}</button>`:'';
const sw=w=>`<span class="sw"><i>${w}</i>${spk(w)}</span>`;
function spellOut(key){const w=joinSum(parse(key)).res;speak(w.split('').join(', '),.75);}
function sayWord(key){speak(sayText(joinSum(parse(key)).res),.85);}

/* ---------- join animation (the word sum itself animates) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ANIM=new WeakMap();
const OPTS=new WeakMap();
function animHTML(key,o={}){
  const parts=parse(key),j=joinSum(parts);let h='',pi=-1;
  j.toks.forEach(tk=>{
    if(tk.dbl){h+=`<span class="plus" data-pd="${pi+1}">+</span><span class="grp dblg" data-d="${pi+1}"><span class="br">(</span><span class="al chg d">${tk.dbl}</span><span class="br">)</span></span>`;return;}
    pi++;if(pi)h+=`<span class="plus" data-p="${pi}">+</span>`;
    const k=tk.mark==='/'?'e':tk.mark==='/i'?'y':tk.dsrc?'d':null;
    const ls=tk.s.split('').map((c,x)=>`<span class="al${k&&x===tk.s.length-1?' chg '+k:''}">${c}</span>`).join('');
    h+=`<span class="grp ${tk.t}" data-g="${pi}" data-morph="${tk.s}">${ls}</span>${tk.mark?`<span class="mk ${k}" data-m="${pi}">${tk.mark}</span>`:''}`;
  });
  const resTxt=j.res.split('').map((c,i)=>j.hl[i]?`<span class="chg ${j.hl[i]}">${c}</span>`:c).join('');
  h+=`<span class="tail"><span class="op arrow">→</span><span class="result">${resTxt}</span></span>`;
  const play=o.play&&parts.length>1;
  const cap=j.notes.length?j.notes.map(n=>NOTE[n]()).join(' '):(play?'Tap <b>Play</b> to watch the parts join.':'');
  return `<div class="anim" data-anim="${key}" data-play="${play?1:0}" data-spell="${o.spell?1:0}" data-ctl="${o.controls===false?0:1}">
   <div class="stage" aria-label="Word sum">${h}</div>
   ${cap?`<p class="anim-cap" aria-live="polite">${cap}</p>`:'<p class="anim-cap" aria-live="polite" hidden></p>'}
   <div class="ctl">${o.spell?spellBtn(key):''}${o.extra||''}</div></div>`;
}
function animState(el){let s=ANIM.get(el);if(!s){const parts=parse(el.dataset.anim);s={parts,j:joinSum(parts),next:1,busy:false,run:0,started:false};ANIM.set(el,s);}return s;}
function resetAnim(el){
  const extra=el.querySelector('.ctl [data-extra]');const o={play:el.dataset.play==='1',spell:el.dataset.spell==='1',controls:el.dataset.ctl!=='0',extra:extra?extra.outerHTML:''};
  const tmp=document.createElement('div');tmp.innerHTML=animHTML(el.dataset.anim,o);const n=tmp.firstElementChild;el.replaceWith(n);return n;}
async function animStep(el){
  const s=animState(el),{parts,j}=s;if(s.busy)return;
  const cap=el.querySelector('.anim-cap'),stage=el.querySelector('.stage');cap.hidden=true;
  if(stage.classList.contains('done'))return;
  s.busy=true;
  if(!s.started){s.started=true;stage.classList.add('go');
    await sleep(700);s.busy=false;return;}
  if(s.next>=parts.length){stage.classList.add('done');
    await sleep(900);
    if(el.isConnected)stage.classList.add('plain');
    s.busy=false;return;}
  const i=s.next,p=parts[i],prev=parts[i-1],c=j.ch[i];
  const pg=el.querySelector(`[data-g="${i-1}"]`),plus=el.querySelector(`[data-p="${i}"]`),mkEl=el.querySelector(`[data-m="${i-1}"]`);
  const lastL=pg?[...pg.querySelectorAll('.al')].pop():null;
  if(c==='e'){
    
    lastL.classList.add('pulse');await sleep(900);if(mkEl)mkEl.classList.add('gone');lastL.classList.add('gone');await sleep(500);
  }else if(c==='y'){
    
    lastL.classList.add('pulse');await sleep(800);if(mkEl)mkEl.classList.add('gone');lastL.textContent='i';lastL.classList.remove('pulse');lastL.classList.add('swap');await sleep(600);
  }else if(c==='d'){
    
    const dg=el.querySelector(`[data-d="${i}"]`);lastL.classList.add('pulse');dg.querySelector('.al').classList.add('pulse');await sleep(900);
    const pd=el.querySelector(`[data-pd="${i}"]`);if(pd)pd.classList.add('gone');dg.classList.add('merged');await sleep(500);
  }else{
    await sleep(500);
  }
  if(plus)plus.classList.add('gone');
  await sleep(550);s.next++;s.busy=false;
}
async function playAnim(el,delay=300){
  if(!el||!el.isConnected)return;
  const st0=ANIM.get(el);if(st0&&(st0.busy||st0.started))el=resetAnim(el);
  const s=animState(el);const token=++s.run;
  await sleep(delay);
  while(el.isConnected&&s.run===token&&!el.querySelector('.stage.done')){await animStep(el);if(s.run!==token)break;await sleep(650);}
}
function autoAnimAll(sec){document.querySelectorAll(`#${sec} .anim[data-play="1"]`).forEach((el,i)=>playAnim(el,1400+i*4500));}

  }else{
    const isC=q.type==='choose',correct=q.o[0];
    body=isC?`${head('Which spelling does this make? '+tag)}${R.checked?A(q.k):sumHTML(parse(q.k),{hide:true})}`
            :`${head('Etymology')}<p style="font-size:1.15rem;font-weight:500">${q.q()}</p>${q.say&&canSpeak?`<div class="sayrow">${q.say.map(w=>`<span class="saychip">${w}${spk(w)}</span>`).join('')}</div>`:''}`;
    body+=`<div class="opts">${q.opts.filter(o=>!R.checked||o===correct||o===R.picked).map(o=>{let c='';if(R.checked){if(o===correct)c='right';else if(o===R.picked)c='wrong';}
      const btn=`<button class="opt ${isC||q.sayOpts?'mono':''} ${c}" data-opt="${o.replace(/"/g,'&quot;')}" ${R.checked?'disabled':''}>${o}</button>`;
      return q.sayOpts&&canSpeak?`<div class="optrow">${btn}${spk(o)}</div>`:btn;}).join('')}</div>`;
    if(R.checked){const ok=R.picked===correct;
      fb=`<div class="verdict ${ok?'good':'bad'}">${ok?'Correct.':'Not quite.'} ${isC?(!ok?'It will come back in a later round.':''):q.e}</div>`;}
  }
  if(R.checked&&R.levelUp){const L=LEVELS[R.levelUp-1];fb+=`<div class="levelup toast"><b>Level ${L.n} unlocked: ${L.name}</b><br>New families: ${L.fam.join(', ')}.</div>`;}
  sec.innerHTML=`<h2 class="sec-title">Spell by structure</h2>${levelsHTML()}${chooserHTML()}
   <div class="score"><span>Question ${R.i+1} of ${R.qs.length}</span><span>Score ${R.score}</span></div>
   <div class="progress"><span style="width:${R.i/R.qs.length*100}%"></span></div>
   <div class="panel" aria-live="polite">${body}${fb}</div>`;
  autoAnimAll('practice');
  if(listenMode&&canSpeak&&q.type==='build'&&!R.checked&&!q.spoken){q.spoken=true;setTimeout(()=>speak(sayText(q.w),.8),300);}
}


/* ---------- your own words, checked with Claude ---------- */
let custom=store.get('custom',{}); // key -> 'word class|definition'
function addCustom(k,pos,def){const w=joinSum(parse(k)).res;KNOWN.add(k);DEFS[w]=DEFS[w]||`${pos}|${def}`;FAM[k]=k.split('+').find(x=>BASES[x]);custom[k]=`${pos}|${def}`;store.set('custom',custom);}
Object.entries(custom).forEach(([k,v])=>{const w=joinSum(parse(k)).res;KNOWN.add(k);if(!DEFS[w])DEFS[w]=v;FAM[k]=k.split('+').find(x=>BASES[x]);});
let sampleFn=null,sampleOff=false,chal=null;
try{window.claude?.use?.('sample').then(f=>{sampleFn=f;if(f&&!document.getElementById('build').hidden)renderBuild();}).catch(()=>{});}catch(_){}
async function challenge(key){
  const parts=parse(key),w=joinSum(parts).res;
  chal={key,status:'asking'};holdWord=true;renderBuild();
  const prompt=`You are checking a spelling app for learners. Is "${w}" a real, standard English word found in a standard British English dictionary (not a proper noun, abbreviation or obsolete form)? It was built from these morphemes: ${parts.map(p=>p.s+' ('+p.t+')').join(' + ')}.
Reply with only a JSON object, for example {"isWord":true,"spelling":"${w}","builtFromTheseParts":true,"partOfSpeech":"noun","definition":"A short, simple definition for a learner."}
- isWord: true only if "${w}" is a real word spelled exactly like that.
- spelling: the correct dictionary spelling of the word these parts are trying to make.
- builtFromTheseParts: true if the word really is made of these parts.
- partOfSpeech: e.g. noun, verb, adjective, adverb (may list two).
- definition: one short, simple sentence for a learner, without using the word itself.`;
  try{
    const r=await sampleFn.json(prompt,{modelTier:'default'});
    if(chal?.key!==key)return;
    const ok=r&&r.isWord===true&&String(r.spelling||'').toLowerCase()===w&&r.builtFromTheseParts!==false;
    if(ok){addCustom(key,String(r.partOfSpeech||'word').toLowerCase(),String(r.definition||'').trim()||'A real English word.');chal={key,status:'added'};}
    else if(r&&r.isWord===false&&r.spelling&&String(r.spelling).toLowerCase()!==w)chal={key,status:'no',msg:`Claude says this isn't a word. The parts would make <b>${String(r.spelling)}</b>, which needs a different spelling, so this word sum doesn't produce it.`};
    else if(r&&r.isWord===true&&r.builtFromTheseParts===false)chal={key,status:'no',msg:`<b>${w}</b> is a word, but Claude says it isn't really built from these parts, so it isn't added.`};
    else chal={key,status:'no',msg:`Claude doesn't recognise <b>${w}</b> as a standard English word.`};
  }catch(e){
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e?.code))sampleOff=true;
    chal={key,status:'err',msg:e?.code==='rate_limited'?'Too many checks for now. Try again in a little while.':e?.code==='not_granted'?'Checking with Claude wasn’t allowed, so this word can’t be checked.':'The check didn’t work this time. You can try again.'};
  }
  if(!document.getElementById('build').hidden)renderBuild();
}

/* ---------- morpheme meanings (press and hold) ---------- */
const MEAN={
 prefix:{re:'again, or back',de:'down, away, or undoing',in:'in or into (inspect, inform). In some words it means “not” (inactive).',con:'with, together',un:'not, or reversing an action',im:'in or into (import); or “not” (immovable). A form of in- used before m, b and p.',as:'to, towards. A form of ad- used before s.',inter:'between',trans:'across, beyond',ob:'against, in the way',ex:'out, out of',sup:'under, up from below. A form of sub- used before p.',dis:'apart, away, or not',pro:'forward, ahead',intro:'inward, within',cor:'with, together. A form of con- used before r.',ab:'away, off',e:'out. A form of ex-.',non:'not'},
 base:{sign:'a mark or token',struct:'build, pile up',move:'move',act:'do, drive',busy:'occupied, having a lot to do',port:'carry',form:'shape',spect:'look',rupt:'break',hope:'wish for something good',stop:'stop, block',rely:'depend on, trust',carry:'take something from place to place',hop:'jump on one foot',run:'move fast on foot',make:'create, produce',care:'look after; feel that something matters'},
 suffix:{s:'more than one (signs); or he, she or it does it (acts)',es:'like -s; used after some endings, such as y changed to i (carries)',ed:'it happened in the past',ing:'happening now, or the activity itself',er:'a person or thing that does it (reporter); or “more” (busier)',est:'the most',ly:'in that way; turns a word into an adverb',ness:'the state of being',ful:'full of',less:'without',al:'to do with (formal); or the act of (removal)',ion:'the act or result of; turns a verb into a noun',ive:'tending to, likely to',ment:'the act or result of',able:'able to be',ance:'the act or state of',ure:'the act or result of',ate:'make or cause (activate); or having',ation:'the act or result of',age:'the act of, or the result of',or:'a person or thing that does it',ator:'a person who does it',acle:'a thing or sight',ify:'make',ature:'the act or result of',ist:'a person who does it or believes in it'}
};
const meaningOf=(s,t)=>(MEAN[t]&&MEAN[t][s])||MEAN.prefix[s]||MEAN.base[s]||MEAN.suffix[s]||'';
function examplesOf(s,t){return [...KNOWN].filter(k=>{const ps=parse(k);return ps.length>1&&ps.some(p=>p.s===s&&p.t===t);}).slice(0,40).sort(()=>Math.random()-.5).slice(0,3).map(k=>joinSum(parse(k)).res);}
let popTimer=0,holdTimer=0,suppressClick=false;
function morphFrom(el){
  if(!el)return null;
  const s=(el.dataset.morph||el.textContent||'').trim();if(!s||/[()]/.test(s))return null;
  const t=el.classList.contains('prefix')?'prefix':el.classList.contains('base')||el.classList.contains('mx-base')?'base':el.classList.contains('suffix')?'suffix':typeOf(s);
  return meaningOf(s,t)?{s,t}:null;
}
function showPop(m){
  const el=document.getElementById('mpop');const ex=examplesOf(m.s,m.t);
  el.innerHTML=`<div class="mpop-head"><p>${meaningOf(m.s,m.t)}</p><button class="mpop-x" data-popclose aria-label="Close">✕</button></div>
   ${ex.length?`<p class="meta">For example: ${ex.join(', ')}</p>`:''}`;
  el.hidden=false;clearTimeout(popTimer);popTimer=setTimeout(()=>{el.hidden=true;},7000);
}
const HOLD_SEL='.tile, .mx-el, .mx-base, .grp';
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest(HOLD_SEL);if(!el)return;
  clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{const m=morphFrom(el);if(m){showPop(m);suppressClick=true;if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}}},450);
});
['pointerup','pointercancel','pointerleave','scroll'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(holdTimer),true));
document.addEventListener('click',e=>{if(suppressClick){suppressClick=false;e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest(HOLD_SEL))e.preventDefault();});
document.addEventListener('pointerover',e=>{const el=e.target.closest(HOLD_SEL);if(el&&!el.title){const m=morphFrom(el);if(m)el.title=meaningOf(m.s,m.t);}});

/* ---------- tabs, settings, events ---------- */
const TABS=['learn','build','matrix','origins','practice'];
const RENDER={learn:renderLearn,build:renderBuild,matrix:renderMatrix,origins:renderOrigins,practice:renderPractice};
function show(tab,scroll=true){
  TABS.forEach(t=>{document.getElementById(t).hidden=t!==tab;document.getElementById('tab-'+t).setAttribute('aria-selected',t===tab);});
  RENDER[tab]();store.set('tab',tab);if(scroll)window.scrollTo({top:0});
}
function applySettings(){
  const s=store.get('settings',{size:'normal',space:'normal'});
  document.documentElement.classList.toggle('large',s.size==='large');document.body.classList.toggle('spaced',s.space==='wide');
  document.querySelectorAll('#segSize button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===s.size));
  document.querySelectorAll('#segSpace button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===s.space));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b){const mb=e.target.closest('.mx-base');if(mb){const m=morphFrom(mb);if(m)showPop(m);return;}
    const st=e.target.closest('.anim[data-play="1"] .stage');if(st)playAnim(st.closest('.anim'));return;}
  const d=b.dataset;
  if(d.tab)return show(d.tab);
  if(d.go)return show(d.go);
  if(d.spell!==undefined)return spellOut(d.spell);
  if(d.popclose!==undefined){document.getElementById('mpop').hidden=true;return;}
  if(d.say!==undefined)return sayWord(d.say);
  if(d.sayw){if(b.closest('summary'))e.preventDefault();return speak(sayText(d.sayw),.8);}
  if(d.mouth)return setMouth(d.mouth);
  if(d.playanim!==undefined)return playAnim(b.closest('.anim'));
  if(d.stepanim!==undefined){let el=b.closest('.anim');const s=ANIM.get(el);
    if(s)s.run++;if(el.querySelector('.stage.done'))return resetAnim(el);return animStep(el);}
  if(d.vs){vsShown.add(d.vs);return renderLearn();}
  if(d.lesson!==undefined){const i=+d.lesson;if(i>=0&&i<LESSONS.length){lessonIdx=i;renderLearn();window.scrollTo({top:0});}return;}
  if(d.add){if(buildDemo)endDemo();lastBuilt=null;holdWord=false;buildParts.push(d.add);store.set('build',buildParts);return renderBuild();}
  if(d.challenge!==undefined){if(sampleFn&&!sampleOff)challenge(buildParts.join('+'));return;}
  if(d.keep!==undefined){holdWord=true;b.closest('.clearbar')?.remove();return;}
  if(d.undo!==undefined){if(buildDemo){endDemo();return renderBuild();}if(!buildParts.length&&lastBuilt){buildParts=lastBuilt;lastBuilt=null;holdWord=true;store.set('build',buildParts);return renderBuild();}buildParts.pop();store.set('build',buildParts);return renderBuild();}
  if(d.clear!==undefined){if(buildDemo)endDemo();holdWord=false;buildParts=[];store.set('build',buildParts);return renderBuild();}
  if(d.mx!==undefined){mxIdx=+d.mx;mxSel=null;reveal=false;mxNew='';store.set('mx',mxIdx);return renderMatrix();}
  if(d.k){const m=MATRICES[mxIdx],c=+d.c;mxSel[d.k][c]=mxSel[d.k][c]===d.x?null:d.x;
    const key=keyFromSel(m,mxSel);mxNew='';
    if(m.list.includes(key)){const arr=found[m.base]||(found[m.base]=[]);if(!arr.includes(key)){arr.push(key);mxNew=key;store.set('found',found);}}
    return renderMatrix();}
  if(d.load){mxSel=selFromKey(MATRICES[mxIdx],d.load);mxNew='';return renderMatrix();}
  if(d.reveal!==undefined){reveal=!reveal;return renderMatrix();}
  const R=round;
  if(d.pick!==undefined){const q=R.qs[R.i],a=q.ans,e=a.indexOf(null);if(e>=0)a[e]=+d.pick;
    if(!a.includes(null)){R.checked=true;const ok=a.map(i=>q.pool[i]).join('+')===q.k;if(ok)R.score++;R.levelUp=record(q.k,ok);}
    return renderPractice();}
  if(d.unpick!==undefined){R.qs[R.i].ans[+d.unpick]=null;return renderPractice();}
  if(d.check!==undefined){const q=R.qs[R.i];R.checked=true;const ok=q.ans.map(i=>q.pool[i]).join('+')===q.k;if(ok)R.score++;R.levelUp=record(q.k,ok);return renderPractice();}
  if(d.opt!==undefined){const q=R.qs[R.i];R.picked=d.opt;R.checked=true;const ok=d.opt===q.o[0];if(ok)R.score++;R.levelUp=q.k?record(q.k,ok):0;return renderPractice();}
  if(d.next!==undefined){R.i++;R.checked=false;R.picked=null;R.levelUp=0;renderPractice();return window.scrollTo({top:0});}
  if(d.wotdhide!==undefined){store.set('wotdHidden',todayKey());return renderLearn();}
  if(d.wotdshow!==undefined){store.set('wotdHidden','');return renderLearn();}
  if(d.wotdgo){const k=d.wotdgo,i=MATRICES.findIndex(m=>m.base===FAM[k]);if(i>=0){mxIdx=i;store.set('mx',i);mxSel=selFromKey(MATRICES[i],k);mxNew='';reveal=false;}return show('matrix');}
  if(d.newround!==undefined){newRound();return renderPractice();}
  if(d.listen!==undefined){listenMode=!listenMode;store.set('listen',listenMode);return renderPractice();}
  if(d.pchooser!==undefined){pChooser=!pChooser;return renderPractice();}
  if(d.pbase){if(d.pbase==='__all')pBases=[];else pBases=pBases.includes(d.pbase)?pBases.filter(x=>x!==d.pbase):[...pBases,d.pbase];store.set('pbases',pBases);return renderPractice();}
  if(d.pstart!==undefined){pChooser=false;newRound();renderPractice();return window.scrollTo({top:0});}
  if(b.id==='openSettings'){document.getElementById('settings').hidden=false;return;}
  if(b.id==='closeSettings'){document.getElementById('settings').hidden=true;return;}
  if(d.v&&b.closest('.seg')){const s=store.get('settings',{size:'normal',space:'normal'});
    if(b.closest('#segSize'))s.size=d.v;else s.space=d.v;store.set('settings',s);applySettings();
    const cur=TABS.find(t=>!document.getElementById(t).hidden);if(cur)RENDER[cur]();}
});
document.getElementById('settings').addEventListener('click',e=>{if(e.target.id==='settings')e.target.hidden=true;});
applySettings();
const hash=(location.hash||'').slice(1);
show(TABS.includes(hash)?hash:store.get('tab','learn'),false);
</script>
